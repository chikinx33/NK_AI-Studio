<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>nekoban s1_01</title>
<link rel="stylesheet" href="../../../_motion/lib/base.css">
<link rel="stylesheet" href="../../../_motion/themes/nekoban.css">
<style>
#floor { position: absolute; inset: -200px; background: url(assets/floor_oak.webp) 0 0 / 230px 230px; }
#floor::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 55%, rgba(255,240,215,.15), rgba(120,70,30,.35)); }
.tint { -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; }
#robot { width: 467px; height: 467px; }
#robot > * { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); }
#rb1 { width: 467px; height: 467px; background: #C0BF9B; -webkit-mask-image: url(assets/body1.png); }
#rb2 { width: 420px; height: 418px; background: #FFFDC9; -webkit-mask-image: url(assets/body2.png); margin-top: -14px; }
#rface { width: 290px; height: 290px; background: #24263A; -webkit-mask-image: url(assets/face.png); margin-top: -10px; }
.reye { width: 62px; height: 62px; background: #77E3FF; -webkit-mask-image: url(assets/eye01.png); box-shadow: none; filter: drop-shadow(0 0 14px #77E3FF); }
#brush { width: 200px; height: 200px; }
#bigbox { width: 856px; height: 816px; }
#bigbox img { position: absolute; left: 0; top: 0; width: 856px; height: 816px; }
#bigcat { width: 441px !important; height: 355px !important; left: 207px !important; top: 330px; }
#clip-full { z-index: 20; }
#logo { width: 860px; filter: drop-shadow(0 10px 0 rgba(90,70,54,.25)); }
.shadow { width: 300px; height: 70px; border-radius: 50%; background: rgba(60,30,10,.28); filter: blur(6px); }
</style>
</head>
<body>
<div id="stage">
  <div id="cam">
    <div id="floor"></div>
    <div class="a shadow" id="sh-box"></div>
    <div class="a shadow" id="sh-robot"></div>
    <img class="a" id="cat" src="assets/sleep/s0.png" style="width:400px;height:500px">
    <img class="a" id="box" src="assets/box_ani01.png" style="width:856px;height:816px">
    <div class="a" id="robot">
      <img id="brush" src="assets/cleaner.png" style="margin:120px 0 0 -150px">
      <div id="rb1" class="tint"></div><div id="rb2" class="tint"></div><div id="rface" class="tint"></div>
      <div class="reye tint" id="eyeL" style="margin:-20px 0 0 -62px"></div><div class="reye tint" id="eyeR" style="margin:-20px 0 0 62px"></div>
    </div>
    <div class="a" id="bigbox">
      <img src="assets/box_ani_cat01.png">
      <img id="bigcat" src="assets/box_ani_cat08.png">
      <img src="assets/box_ani_cat05.png">
    </div>
  </div>
  <div class="full" id="clip-full"><video class="blurbg" data-src="assets/clip_{lang}.mp4"></video><video class="fg" data-src="assets/clip_{lang}.mp4"></video></div>
  <div class="a flood" id="flood"></div>
  <img class="a" id="logo" src="assets/logo.png">
  <div class="a pill" id="pill"></div>
  <div class="a sticker" id="st1"></div>
  <div class="a sticker" id="st2"></div>
  <div class="a sticker" id="st3"></div>
  <div class="a sticker" id="st4"></div>
  <div id="heads"></div>
  <div class="vignette"></div><div class="grain" id="grain"></div>
</div>
<script src="../../../_motion/lib/motion.js"></script>
<script src="assets/beats.js"></script>
<script>
const { $, put, hide, sp, pop, io, ein, eout, lerp, tx, clamp } = M;
const b = M.beats(B);
const h = (i) => b(2 * i);                      // music is ~176 bpm: one step = two beats

const TEXT = {
  clunk: { ko: '드르륵!', en: 'Clunk!' },
  pop: { ko: '쏙!', en: 'POP!' },
  pill: { ko: '<b>Google Play</b> 무료 다운로드', en: 'Free on <b>Google Play</b>' },
};
$('st1').textContent = tx(TEXT.clunk); $('st2').textContent = tx(TEXT.pop);
$('st3').textContent = tx(TEXT.pop); $('st4').textContent = tx(TEXT.pop);
$('pill').innerHTML = tx(TEXT.pill);

const S2 = h(7.5), S3 = S2 + 7.25;              // real gameplay starts / end card starts
const DUR = S3 + 3.0;
const drawK = M.kinetic($('heads'), [
  { s: h(0.3), e: h(2), step: 0.32, ko: '집사가|외출한 오후,', en: "While the butler's|out," },
  { s: h(2), e: h(4.4), step: 0.32, ko: '꼬마 청소 로봇|*출동!*', en: 'a tiny robot vacuum|*sets off!*' },
  { s: h(4.6), e: S2 - 0.1, step: 0.36, ko: '고양이가|상자 속으로|*쏙!*', en: 'and the cat goes|*POP!*|into the box!' },
  { s: S2 + 0.7, e: S2 + 4.7, step: 0.34, y: 1430, ko: '마지막 한 마리까지|모두 *쏙쏙!*', en: 'Every last cat,|*pop, pop!*' },
  { s: S2 + 6.0, e: S3 - 0.05, step: 0.34, y: 1430, ko: '오늘의 임무|*완료!*', en: 'Mission|*complete!*' },
  { s: S3 + 0.9, e: null, step: 0.3, y: 1210, ko: '*네코반!*', en: '*NEKOBAN!*' },
], 1420);
const F = M.full($('clip-full'), 1080, 1920);
const CAM = [[0, 1, 540, 960], [0.55, 1.45, 724, 1000], [2.0, 1.45, 724, 1000], [2.7, 1, 540, 960],
             [4.7, 1, 540, 960], [5.2, 1.45, 300, 860], [6.1, 1.3, 330, 880], [6.6, 1, 540, 960]];
const imgs = []; for (let i = 0; i <= 30; i++) imgs.push(`assets/sleep/s${i}.png`); for (let i = 0; i <= 40; i++) imgs.push(`assets/jump/j${i}.png`); for (let i = 0; i <= 30; i++) imgs.push(`assets/inbox/i${i}.png`);

async function seek(t) {
  // ---------- scene 1: robot pushes the box onto the napping cat ----------
  const s1 = t < S2 + 0.9;
  const CATX = 820, Y = 980;
  const enter = sp(t, h(0), 1.3, 0.85);
  const push = io(t, h(2.4), h(4) - h(2.4));
  const rx = lerp(-340, 240, enter) + push * 215;
  const bx = rx + 365;
  const arrive = t >= h(4);
  const land = M.hit(t, h(4.6), 1, 9);
  const zoom = io(t, h(4.5), 0.45);                  // punch in to the box
  if (s1) {
    const cs = lerp(1, 1.18, zoom);
    $('cam').style.transformOrigin = `${CATX}px ${Y}px`;
    $('cam').style.transform = `scale(${cs}) translate(${(540 - CATX) * zoom / cs}px, ${(1000 - Y) * zoom / cs}px)`;
    // robot: bobbing, spinning brush, blinking eyes
    const bob = Math.sin(t * 14) * 4 * (t < h(4.2) ? 1 : 0);
    put($('robot'), { x: rx, y: Y + 40 + bob, s: 0.95, show: zoom < 0.4 });
    $('brush').style.transform = `translate(-50%,-50%) rotate(${t * 900}deg)`;
    const blink = (t % 2.1) < 0.12 ? 0.15 : 1;
    for (const id of ['eyeL', 'eyeR']) $(id).style.transform = `translate(-50%,-50%) scaleY(${blink})`;
    put($('sh-robot'), { x: rx, y: Y + 250, s: 1.45, show: zoom < 0.4 });
    // box (closed) slides; squashes when it lands on the cat
    const bsx = 1 + land * 0.18, bsy = 1 - land * 0.18;
    put($('box'), { x: Math.min(bx, CATX), y: Y - 40 - (arrive ? 0 : Math.abs(Math.sin(t * 14)) * 5), s: 0.62, sx: bsx, sy: bsy, show: t < h(4.6) });
    put($('sh-box'), { x: Math.min(bx, CATX), y: Y + 215, s: 1.55 });
    // cat: sleeping loop, then the jump into the box
    if (!arrive) {
      const f = Math.floor(t * 15) % 31; $('cat').src = `assets/sleep/s${f}.png`;
      put($('cat'), { x: CATX + 10, y: Y - 180, s: 2.3, show: bx < CATX - 80 || t < h(3.9) });
    } else if (t < h(4.6)) {
      const f = Math.min(40, Math.floor((t - h(4)) / (h(4.6) - h(4)) * 41)); $('cat').src = `assets/jump/j${f}.png`;
      put($('cat'), { x: CATX, y: Y - 330 - Math.sin(Math.PI * f / 40) * 160, s: 2.3 });
    } else {
      // in-game look: the cat dives in head first, tail wagging out of the open box
      const f = Math.floor((t - h(4.6)) * 15) % 31; $('cat').src = `assets/inbox/i${f}.png`;
      put($('cat'), { x: CATX, y: Y - 110, s: 2.45, sx: 1 + land * 0.12, sy: 1 - land * 0.12 });
    }
    // (old close-up removed: the in-game sprite is used instead)
    if (zoom > 0) {
      const up = sp(t, h(4.8), 2.2, 0.5);
      $('bigcat').style.top = `${lerp(560, 300, up)}px`;
      $('bigcat').style.transform = `rotate(${Math.sin((t - h(4.8)) * 5) * 4 * Math.exp(-(t - h(4.8)))}deg)`;
      hide($('bigbox'));
    } else hide($('bigbox'));
  } else { for (const id of ['robot', 'box', 'cat', 'bigbox', 'sh-box', 'sh-robot']) hide($(id)); }
  M.sticker($('st1'), t, h(2.6), h(3.9), { x: 620, y: 640, r: -10, s: 1.2 });
  M.sticker($('st2'), t, h(5.0), S2 - 0.2, { x: 800, y: 520, r: 10, s: 1.6 });

  // ---------- scene 2: the real game, full screen, camera follows the cats ----------
  let wait = null;
  if (t >= S2 && t < S3 + 0.5) {
    const lt = t - S2, cam = M.keys(lt, CAM);
    wait = M.fullAt(F, lt, cam, sp(t, S2, 2.0, 0.85));
  } else hide($('clip-full'));
  M.sticker($('st3'), t, S2 + 0.95, S2 + 2.2, { x: 660, y: 760, r: 12 });
  M.sticker($('st4'), t, S2 + 5.5, S2 + 5.95, { x: 560, y: 650, r: -10 });

  // ---------- scene 3: end card ----------
  if (t >= S3) {
    M.flood($('flood'), 540, 1000, ein(t, S3, 0.32), 'var(--bg)');
    put($('logo'), { y: 820 + Math.sin(t * 2.4) * 8, s: pop(t, S3 + 0.35, 1.9), r: (1 - sp(t, S3 + 0.35, 1.9, 0.7)) * -6 });
    put($('pill'), { y: 1420, s: pop(t, S3 + 1.4, 2.6) });
  } else { hide($('flood')); hide($('logo')); hide($('pill')); }

  drawK(t);
  M.grain($('grain'), t);
  if (wait) await wait;
}

window.READY = M.ready({ images: imgs }).then(() => { seek(0); return DUR; });
</script>
</body>
</html>
