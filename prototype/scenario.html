<!DOCTYPE html>
<html lang="ko" data-theme="dark" class="layout-fixed preload-veiled">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NK_Studio · 프리 프로덕션</title>
  <style>
    html.preload-veiled, body.preload-veiled { background:#0f172a; color:#cbd5e1; }
    html.preload-veiled .app, html.preload-veiled .main { visibility:hidden; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=3.1445" />
  <script src="core.js?v=3.1445" defer></script>
  <script src="js/config.js?v=3.1445" defer></script>
  <script src="js/utils.js?v=3.1445" defer></script>
  <script src="store.js?v=3.1445" defer></script>
  <script src="api.js?v=3.1445" defer></script>
  <script src="js/state.js?v=3.1445" defer></script>
  <script src="js/auth.js?v=3.1445" defer></script>
  <script src="js/navigation.js?v=3.1445" defer></script>
  <script src="js/service/media.js?v=3.1445" defer></script>
  <script src="js/service/project.js?v=3.1445" defer></script>
  <script src="js/service/character-registry.js?v=3.1445" defer></script>
  <script src="js/service/content-library.js?v=3.1445" defer></script>
  <script src="js/service/scene-assets.js?v=3.1445" defer></script>
  <script src="js/service/episode-locations.js?v=3.1445" defer></script>
  <script src="js/service/shot-vocab.js?v=3.1445" defer></script>
  <script src="js/ui/common.js?v=3.1445" defer></script>
  <script src="js/ui/dashboard.js?v=3.1445" defer></script>
  <script src="js/scenario-progress.js?v=3.1445" defer></script>
  <script src="js/ui/scenario.js?v=3.1445" defer></script>
  <script src="js/ui/production.js?v=3.1445" defer></script>
  <script src="script.js?v=3.1445" defer></script>
</head>

<body class="layout-fixed">
  <div id="page-loading" class="page-loading">
    <div class="loading-box">
      <div class="spinner"></div>
      <p>로딩중...</p>
    </div>
  </div>
  <div class="grain"></div>
  <div class="app no-sidebar">

    <div id="auth-overlay" class="auth-overlay hidden">
      <div class="auth-card">
        <p class="auth-title">로그인 하세요.</p>
        <a class="btn-primary no-underline" href="app.html">로그인 하기</a>
      </div>
    </div>

    <main class="main blur-target">

      <div class="main-body">
        <section class="scenario-section" id="scenario-section">
          <div class="scenario-grid">
            <div class="section-caption left-caption caption-row">
              <span data-i18n="scenario_overview">개요</span>
            </div>
              <form class="card scenario-form" id="scenario-form">
                <div class="form-group">
                  <label data-i18n="scenario_topic">주제</label>
                  <input type="text" name="topic" placeholder="예: 네모와 세모의 첫 모험" data-i18n-placeholder="scenario_topic_placeholder" required />
                </div>
                <div class="form-group">
                  <div class="scenario-form-label-row">
                    <label data-i18n="scenario_story">이야기</label>
                    <button type="button" class="scenario-story-ai-btn" data-action="scenario-structure-story" data-i18n-title="scenario_story_ai_title" data-i18n-aria-label="scenario_story_ai_title" aria-label="이야기를 AI로 정리">
                      <span class="scenario-story-ai-icon" aria-hidden="true"></span>
                    </button>
                    <button type="button" class="scenario-story-toggle-btn" data-action="scenario-toggle-story-view" aria-label="원본/AI 전환" title="원본/AI 전환" data-i18n-title="scenario_story_toggle_title" data-i18n-aria-label="scenario_story_toggle_title">
                      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 12a9 9 0 1 0 3-6.7"></path>
                        <path d="M3 3v6h6"></path>
                      </svg>
                    </button>
                  </div>
                  <div class="scenario-story-controls">
                    <div class="scenario-story-field" id="scenario-story-field">
                      <textarea name="story" id="scenario-story-input" rows="10" placeholder="원하는 이야기의 흐름, 사건, 감정선을 자유롭게 적어 주세요." data-i18n-placeholder="scenario_story_placeholder" required></textarea>
                      <div id="scenario-story-loading" class="scenario-story-loading" hidden aria-live="polite">
                        <div class="spinner" aria-hidden="true"></div>
                        <span data-i18n="scenario_story_ai_loading">이야기를 정리하는 중입니다...</span>
                      </div>
                      <div class="scenario-story-token-bar" id="scenario-story-token-bar" hidden></div>
                    </div>
                  </div>
                </div>
              <div class="form-group">
                <label data-i18n="scenario_genre">장르</label>
                <select id="purpose-category" name="purposeCategory" required></select>
              </div>
              <div class="form-group">
                <label data-i18n="scenario_subgenre">세부 장르</label>
                <select id="purpose-tag-select"></select>
              </div>
              <div class="form-group">
                <label data-i18n="scenario_target">시청 타겟</label>
                <select name="target" id="target-select" required></select>
              </div>
              <div class="form-group">
                <label data-i18n="scenario_view_purpose">시청 목적</label>
                <select id="needs-select"></select>
              </div>
              <div class="form-group">
                <label data-i18n="scenario_duration">영상 길이</label>
                <div class="scenario-inline-controls">
                  <select id="duration-select"></select>
                  <input id="duration-custom-input" type="number" min="1" step="1" placeholder="직접 입력(초)" data-i18n-placeholder="scenario_duration_custom_placeholder" />
                </div>
              </div>
              <div class="form-group">
                <label data-i18n="scenario_aspect_ratio">화면 비율</label>
                <div class="ratio-group scenario-ratio-group" id="ratio-group">
                  <button type="button" class="btn-secondary ratio-btn active" data-ratio="16:9">16:9</button>
                  <button type="button" class="btn-secondary ratio-btn" data-ratio="9:16">9:16</button>
                  <button type="button" class="btn-secondary ratio-btn" data-ratio="1:1">1:1</button>
                </div>
              </div>
              <div class="form-group">
                <label data-i18n="scenario_tone">톤</label>
                <select id="tone-select"></select>
              </div>
              <div class="form-group">
                <label data-i18n="scenario_style">스타일</label>
                <select id="style-select"></select>
              </div>
              <div class="form-group">
                <label data-i18n="scenario_character">캐릭터</label>
                <div id="character-chips" class="character-chips scenario-switches"></div>
              </div>
                <div class="form-group">
                  <label data-i18n="scenario_voice_mode">음성 모드</label>
                  <select id="voice-mode-select" name="voiceMode">
                    <option value="none" data-i18n="scenario_voice_none">없음</option>
                    <option value="narration" data-i18n="scenario_voice_narration">나레이션</option>
                    <option value="dubbing" data-i18n="scenario_voice_dubbing">더빙</option>
                  </select>
                </div>
                <div class="form-group scenario-knowledge-group">
                  <div class="scenario-knowledge-head">
                    <label data-i18n="scenario_knowledge_hub">브랜드 허브</label>
                    <button type="button" id="scenario-knowledge-toggle" class="scenario-circle-toggle" aria-expanded="false" aria-controls="scenario-knowledge-summary">+</button>
                  </div>
                  <div id="scenario-knowledge-summary" class="scenario-knowledge-panel" data-i18n="scenario_knowledge_loading">브랜드 허브 문맥을 불러오는 중입니다.</div>
                </div>
            </form>

            <div class="section-caption right-caption caption-row">
              <div class="caption-left">
                <span data-i18n="scenario_script">대본</span>
                <button type="button" class="btn-icon-sm" id="scenario-copy-btn" title="시나리오 복사" aria-label="시나리오 복사" data-i18n-title="scenario_copy" data-i18n-aria-label="scenario_copy"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
                <button type="button" class="btn-icon-sm" id="camera-vocab-btn" title="카메라 용어 안내" aria-label="카메라 용어 안내"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg></button>
                <button type="button" class="btn-icon-sm" id="scenario-diag-btn" title="생성 진단" aria-label="생성 진단"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></button>
                <button type="button" class="btn-icon-sm" id="scenario-inject-btn" title="시나리오 주입(붙여넣기 반영)" aria-label="시나리오 주입"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M8 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-4"/></svg></button>
              </div>
              <div class="caption-fold-mode">
                <button type="button" class="btn-icon-sm" id="scene-expand-all" title="전체 펼침" aria-label="전체 펼침" data-i18n-title="scene_expand_all" data-i18n-aria-label="scene_expand_all"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 10 12 4 18 10"/><polyline points="6 14 12 20 18 14"/></svg></button>
                <button type="button" class="btn-icon-sm" id="scene-collapse-all" title="전체 접기" aria-label="전체 접기" data-i18n-title="scene_collapse_all" data-i18n-aria-label="scene_collapse_all"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 4 12 10 18 4"/><polyline points="6 20 12 14 18 20"/></svg></button>
                <button type="button" class="btn-icon-sm active" id="scene-focus-mode" title="부분 펼침" aria-label="부분 펼침" data-i18n-title="scene_focus_mode" data-i18n-aria-label="scene_focus_mode"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 10 12 4 18 10" stroke-width="3.2"/><polyline points="6 14 12 20 18 14" stroke-width="2.2"/></svg></button>
              </div>
              <div class="caption-actions">
                <button type="submit" form="scenario-form" class="btn-primary" data-i18n="scenario_generate">시나리오 생성</button>
                <button type="reset" form="scenario-form" class="btn-ghost" data-i18n="scenario_reset">초기화</button>
                <button class="btn-secondary" id="save-draft" data-i18n="scenario_save">저장하기</button>
              </div>
            </div>
            <div class="card scenario-results results-card">
              <div id="scenario-error" class="error-banner hidden"></div>
              <div id="scenario-cards" class="scenario-cards">
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <div id="common-modal" class="img-modal hidden">
    <div class="img-modal__inner common-modal-box">
      <button class="close-modal" data-close="common-modal">✕</button>
      <div id="common-modal-body"></div>
    </div>
  </div>
  <div id="camera-vocab-modal" class="img-modal hidden">
    <div class="img-modal__inner camera-vocab-modal-box">
      <div id="camera-vocab-modal-body"></div>
    </div>
  </div>
  <div id="scenario-diag-modal" class="img-modal hidden">
    <div class="img-modal__inner scenario-diag-modal-box">
      <div id="scenario-diag-modal-body"></div>
    </div>
  </div>
  <div id="scenario-inject-modal" class="img-modal hidden">
    <div class="img-modal__inner scenario-inject-modal-box">
      <h4 class="scenario-inject-title">시나리오 주입</h4>
      <p class="muted small scenario-inject-help">복사 버튼으로 받은 시나리오를 원하는 대로 수정한 뒤 아래에 붙여넣고 “반영”을 누르면 카드 내용이 그대로 재편성됩니다. <strong>Scene / 장소 / 화면 / 행동 / 대사</strong> 라벨 형식을 유지해 주세요.</p>
      <textarea id="scenario-inject-text" class="scenario-inject-textarea" spellcheck="false" placeholder="Scene 1 cut1 · 2s&#10;장소: 2D 애니메이션 법정 — 높은 판사석&#10;화면: 로우앵글, 판사석 하단에서 위로 틸트…&#10;행동: @판사가 서류 더미를 내려다보며 눈살을 찌푸린다&#10;대사: @판사: 오늘부터 세 명씩 들어오라고 해!"></textarea>
      <div class="scenario-inject-actions">
        <button type="button" class="btn-ghost" id="scenario-inject-cancel">취소</button>
        <button type="button" class="btn-primary" id="scenario-inject-apply">반영</button>
      </div>
    </div>
  </div>
  <script>
    // 실패 시에도 오버레이가 남지 않도록 최후 안전장치
    window.addEventListener('load', function () {
      var p = document.getElementById('page-loading');
      if (p) p.classList.add('hidden');
      var main = document.querySelector('.main');
      if (main) main.classList.remove('loading-blur');
    });
  </script>
</body>

</html>
