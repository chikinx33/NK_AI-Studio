<!DOCTYPE html>
<html lang="ko" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NK_Studio · 프리 프로덕션</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="core.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="store.js" defer></script>
  <script src="api.js" defer></script>
  <script src="js/state.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/navigation.js" defer></script>
  <script src="js/service/media.js" defer></script>
  <script src="js/service/project.js" defer></script>
  <script src="js/ui/common.js" defer></script>
  <script src="js/ui/dashboard.js" defer></script>
  <script src="js/ui/scenario.js" defer></script>
  <script src="js/ui/production.js" defer></script>
  <script src="script.js" defer></script>
</head>

<body>
  <div id="page-loading" class="page-loading">
    <div class="loading-box">
      <div class="spinner"></div>
      <p>로딩 중...</p>
    </div>
  </div>
  <div class="grain"></div>
  <div class="app no-sidebar">

    <div id="auth-overlay" class="auth-overlay hidden">
      <div class="auth-card">
        <p class="auth-title">로그인 하세요.</p>
        <a class="btn-primary no-underline" href="index.html">로그인 하기</a>
      </div>
    </div>

    <main class="main blur-target">

      <div class="main-body">
        <section class="scenario-section" id="scenario-section">
          <div class="scenario-grid">
            <div class="section-caption left-caption caption-row">
              <span>개요</span>
            </div>
            <form class="card scenario-form" id="scenario-form">
              <div class="form-group">
                <label>주제</label>
                <textarea name="topic" rows="2" placeholder="예: 모양새 친구들" required></textarea>
              </div>
              <div class="form-group">
                <label>장르</label>
                <select id="purpose-category" name="purposeCategory" required></select>
              </div>
              <div class="form-group">
                <div id="purpose-tags" class="tag-checkboxes"></div>
              </div>
              <div class="form-group">
                <label>시청 타겟</label>
                <select name="target" id="target-select" required>
                  <option value="영유아">영유아 · 학습/놀이/감성 발달</option>
                  <option value="아동">아동 · 기초 학습/호기심/놀이/이야기</option>
                  <option value="청소년">청소년 · 학습/시험/자기 정체성/엔터테인먼트</option>
                  <option value="청년">청년 · 엔터테인먼트/감성/힐링/정보/자기계발</option>
                  <option value="직장인">직장인 · 업무 효율/실용 정보/자기계발/스트레스 해소</option>
                  <option value="중장년">중장년 · 생활 정보/가정/경제/건강/취미/노후 설계</option>
                  <option value="시니어">시니어 · 건강/여가/힐링/회고/정치</option>
                  <option value="전 연령">전 연령 · 공감/정보/엔터테인먼트</option>
                </select>
              </div>
              <div class="form-group">
                <div class="tag-checkboxes" id="needs-tags">
                  <!-- populated as toggle chips in JS -->
                </div>
              </div>
              <div class="form-group">
                <label>영상 길이</label>
                <div class="tag-checkboxes" id="duration-tags">
                  <button type="button" class="duration-toggle active" data-value="15">15s</button>
                  <button type="button" class="duration-toggle" data-value="30">30s</button>
                  <button type="button" class="duration-toggle" data-value="45">45s</button>
                  <button type="button" class="duration-toggle" data-value="60">1m</button>
                  <button type="button" class="duration-toggle" data-value="1800">30m</button>
                  <button type="button" class="duration-toggle" data-value="3600">1h</button>
                  <button type="button" class="duration-toggle" data-value="7200">2h</button>
                </div>
              </div>
              <div class="form-group">
                <label>톤</label>
                <input name="tone" type="text" placeholder="담백, 신뢰감, 유머러스..." />
              </div>
              <div class="form-group">
                <div id="tone-tags" class="tag-checkboxes"></div>
              </div>
              <div class="form-group">
                <label>스타일</label>
                <input name="style" type="text" placeholder="실사, 다큐 스타일, 브이로그..." />
              </div>
              <div class="form-group">
                <div id="style-tags" class="tag-checkboxes"></div>
              </div>
              <div class="form-group">
                <label>추가 항목</label>
                <textarea name="banned" rows="2" placeholder="부연 설명을 입력하세요"></textarea>
              </div>
            </form>

            <div class="section-caption right-caption caption-row">
              <div class="caption-left">
                <span>대본</span>
              </div>
              <div class="caption-actions">
                <div class="ratio-group" id="ratio-group">
                  <button type="button" class="btn-secondary ratio-btn active" data-ratio="16:9">16:9</button>
                  <button type="button" class="btn-secondary ratio-btn" data-ratio="9:16">9:16</button>
                  <button type="button" class="btn-secondary ratio-btn" data-ratio="1:1">1:1</button>
                </div>
                <button type="submit" form="scenario-form" class="btn-primary">시나리오 생성</button>
                <button type="reset" form="scenario-form" class="btn-ghost">초기화</button>
                <button class="btn-secondary" id="save-draft">저장하기</button>
                <button class="btn-ghost theme-toggle" data-theme-toggle onclick="toggleTheme('local')" aria-label="테마 전환"></button>
              </div>
            </div>
            <div class="card scenario-results results-card">
              <div id="scenario-error" class="error-banner hidden"></div>
              <div id="scenario-cards" class="scenario-cards">
              </div>
              <div id="scenario-loading" class="loading-overlay hidden">
                <div class="spinner"></div>
                <p>작업 중...</p>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script>
    // 실패 시에도 오버레이가 남지 않도록 최후 안전장치
    window.addEventListener('load', function () {
      var p = document.getElementById('page-loading');
      if (p) p.classList.add('hidden');
      var main = document.querySelector('.main');
      if (main) main.classList.remove('loading-blur');
    });
  </script>
</body>

</html>
