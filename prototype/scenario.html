<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NK_Studio · Scenario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="grain"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">NK</div>
        <div class="brand-text">
          <span class="title" data-i18n="brand_title">NK_Studio</span>
          <span class="subtitle" data-i18n="brand_subtitle">자동화 영상 파이프라인</span>
        </div>
      </div>
      <nav class="nav">
        <a class="nav-item" href="index.html">
          <span class="dot"></span><span data-i18n="nav_dashboard">대시보드</span>
        </a>
        <a class="nav-item active" href="scenario.html">
          <span data-i18n="nav_scenario">시나리오 작성</span>
        </a>
        <a class="nav-item" href="#"><span data-i18n="nav_scenes">씬 & 파이프라인</span></a>
        <a class="nav-item" href="#"><span data-i18n="nav_media">미디어 랩</span></a>
        <a class="nav-item" href="#"><span data-i18n="nav_voice">더빙 · 자막</span></a>
        <a class="nav-item" href="#"><span data-i18n="nav_render">결과 대기열</span></a>
        <a class="nav-item" href="#"><span data-i18n="nav_publish">배포</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="pill warn" data-i18n="badge_render_queue">자동화 큐 3</div>
        <button class="btn-secondary" data-i18n="btn_new_project">새 파이프라인</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h4 data-i18n="channels_title">채널</h4>
          <div class="chips">
            <span class="chip-filter active" data-i18n="ch_all">전체</span>
            <span class="chip-filter" data-i18n="ch_knowledge">지식</span>
            <span class="chip-filter" data-i18n="ch_history">역사</span>
            <span class="chip-filter" data-i18n="ch_food">음식</span>
            <span class="chip-filter" data-i18n="ch_local">지역</span>
            <span class="chip-filter" data-i18n="ch_economy">경제</span>
            <span class="chip-filter" data-i18n="ch_science">과학</span>
            <span class="chip-filter" data-i18n="ch_politics">정치(만화)</span>
          </div>
        </div>
        <div class="top-actions">
          <button class="btn-ghost icon-btn" aria-label="알림">
            🔔
          </button>
          <button class="btn-ghost theme-toggle" data-theme-toggle onclick="toggleTheme()">☀</button>
          <button class="btn-ghost lang-toggle" data-lang-toggle onclick="toggleLang()">EN</button>
        </div>
      </header>

      <div class="main-body">
        <section class="scenario-section" id="scenario-section">
          <div class="scenario-grid">
            <form class="card scenario-form" id="scenario-form">
              <div class="form-group">
                <label>주제</label>
                <input name="topic" type="text" placeholder="예: 도심 자전거 안전" required />
              </div>
              <div class="form-group">
                <label>영상 목적 (대분류)</label>
                <select id="purpose-category" name="purposeCategory" required></select>
              </div>
              <div class="form-group">
                <label>세부 목적 (중복 선택 가능)</label>
                <div id="purpose-tags" class="tag-checkboxes"></div>
              </div>
              <div class="form-group">
                <label>시청 타겟</label>
                <select name="target" id="target-select" required>
                  <option value="영유아">영유아 · 학습/놀이/감성 발달</option>
                  <option value="아동">아동 · 기초 학습/호기심/놀이/이야기</option>
                  <option value="청소년">청소년 · 학습/시험/자기 정체성/엔터테인먼트</option>
                  <option value="청년">청년 · 엔터테인먼트/감성/실용 정보/자기계발</option>
                  <option value="직장인">직장인 · 업무 효율/실용 정보/자기 계발/스트레스 해소</option>
                  <option value="중장년">중장년 · 생활 정보/가정/경제/건강/취미/노후 설계</option>
                  <option value="시니어">시니어 · 건강/여가/힐링/회고/정치</option>
                  <option value="전 연령">전 연령 · 공감/정보/엔터테인먼트</option>
                </select>
              </div>
              <div class="form-group">
                <label>관심사/니즈 (중복 선택)</label>
                <div class="tag-checkboxes" id="needs-tags">
                  <label class="tag-check"><input type="checkbox" name="needs" value="학습">학습</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="놀이">놀이</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="엔터테인먼트">엔터테인먼트</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="스토리">스토리</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="감성">감성</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="힐링">힐링</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="공감">공감</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="실용 정보">실용 정보</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="생활 정보">생활 정보</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="업무 효율">업무 효율</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="생산성">생산성</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="자기계발">자기계발</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="시험">시험</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="진로">진로</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="커리어">커리어</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="창업">창업</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="경제">경제</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="재테크">재테크</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="소비">소비</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="노후 설계">노후 설계</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="정치">정치</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="사회 이슈">사회 이슈</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="시사">시사</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="건강">건강</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="운동">운동</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="식습관">식습관</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="여가">여가</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="취미">취미</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="여행">여행</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="스트레스 해소">스트레스 해소</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="번아웃 회복">번아웃 회복</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="멘탈 관리">멘탈 관리</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="관계">관계</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="가정">가정</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="자녀">자녀</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="연애">연애</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="소통">소통</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="자기 성찰">자기 성찰</label>
                  <label class="tag-check"><input type="checkbox" name="needs" value="라이프스타일">라이프스타일</label>
                </div>
              </div>
              <div class="form-group">
                <label>영상 길이</label>
                <div class="inline">
                  <label><input type="radio" name="duration" value="30" checked />30초</label>
                  <label><input type="radio" name="duration" value="45" />45초</label>
                  <label><input type="radio" name="duration" value="60" />60초</label>
                </div>
              </div>
              <div class="form-group">
                <label>톤 & 스타일</label>
                <input name="tone" type="text" placeholder="담백, 신뢰감, 유머러스..." required />
              </div>
              <div class="form-group">
                <label>금지 요소</label>
                <textarea name="banned" rows="2" placeholder="예: 공포 표현 금지, 과장 금지"></textarea>
              </div>
              <div class="form-group inline">
                <label><input type="checkbox" name="cta" id="cta-check" /> CTA 포함</label>
                <input name="ctaText" id="cta-text" type="text" placeholder="예: 더 알아보기 · 다운로드" disabled />
              </div>
              <div class="form-actions">
                <button type="reset" class="btn-ghost">초기화</button>
                <button type="submit" class="btn-primary" id="scenario-submit">시나리오 생성</button>
              </div>
            </form>

            <div class="card scenario-results">
              <div class="section-head">
                <h4>생성 결과 (씬 단위)</h4>
                <button class="btn-secondary" id="confirm-scenes">최종 컨펌 → 씬 파이프라인</button>
              </div>
              <div id="scenario-cards" class="scenario-cards">
                <p class="muted">입력 후 “시나리오 생성”을 누르면 결과가 여기에 표시됩니다.</p>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
