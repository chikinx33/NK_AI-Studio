<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NK_Studio · Scenario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="grain"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">NK</div>
        <div class="brand-text">
          <span class="title" data-i18n="brand_title">NK_Studio</span>
          <span class="subtitle" data-i18n="brand_subtitle">자동화 영상 파이프라인</span>
        </div>
      </div>
      <nav class="nav">
        <a class="nav-item" href="index.html">
          <span class="dot"></span><span data-i18n="nav_dashboard">대시보드</span>
        </a>
        <a class="nav-item active" href="scenario.html">
          <span data-i18n="nav_scenario">시나리오 작성</span>
        </a>
        <a class="nav-item" href="#"><span data-i18n="nav_scenes">씬 & 파이프라인</span></a>
        <a class="nav-item" href="#"><span data-i18n="nav_media">미디어 랩</span></a>
        <a class="nav-item" href="#"><span data-i18n="nav_voice">더빙 · 자막</span></a>
        <a class="nav-item" href="#"><span data-i18n="nav_render">결과 대기열</span></a>
        <a class="nav-item" href="#"><span data-i18n="nav_publish">배포</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="pill warn" data-i18n="badge_render_queue">자동화 큐 3</div>
        <button class="btn-secondary" data-i18n="btn_new_project">새 파이프라인</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h4 data-i18n="channels_title">채널</h4>
          <div class="chips">
            <span class="chip-filter active" data-i18n="ch_all">전체</span>
            <span class="chip-filter" data-i18n="ch_knowledge">지식</span>
            <span class="chip-filter" data-i18n="ch_history">역사</span>
            <span class="chip-filter" data-i18n="ch_food">음식</span>
            <span class="chip-filter" data-i18n="ch_local">지역</span>
            <span class="chip-filter" data-i18n="ch_economy">경제</span>
            <span class="chip-filter" data-i18n="ch_science">과학</span>
            <span class="chip-filter" data-i18n="ch_politics">정치(만화)</span>
          </div>
        </div>
        <div class="top-actions">
          <button class="btn-ghost icon-btn" aria-label="알림">
            🔔
          </button>
          <button class="btn-ghost theme-toggle" data-theme-toggle onclick="toggleTheme()">☀</button>
          <button class="btn-ghost lang-toggle" data-lang-toggle onclick="toggleLang()">EN</button>
        </div>
      </header>

      <div class="main-body">
        <section class="scenario-section" id="scenario-section">
          <div class="scenario-grid">
            <form class="card scenario-form" id="scenario-form">
              <div class="form-group">
                <label>주제</label>
                <input name="topic" type="text" placeholder="예: 도심 자전거 안전" required />
              </div>
              <div class="form-group">
                <label>영상 목적 (대분류)</label>
                <select id="purpose-category" name="purposeCategory" required></select>
              </div>
              <div class="form-group">
                <label>세부 목적 (중복 선택 가능)</label>
                <div id="purpose-tags" class="tag-checkboxes"></div>
              </div>
              <div class="form-group">
                <label>타겟</label>
                <input name="target" type="text" placeholder="예: 20-30 직장인" required />
              </div>
              <div class="form-group">
                <label>영상 길이</label>
                <div class="inline">
                  <label><input type="radio" name="duration" value="30" checked />30초</label>
                  <label><input type="radio" name="duration" value="45" />45초</label>
                  <label><input type="radio" name="duration" value="60" />60초</label>
                </div>
              </div>
              <div class="form-group">
                <label>톤 & 스타일</label>
                <input name="tone" type="text" placeholder="담백, 신뢰감, 유머러스..." required />
              </div>
              <div class="form-group">
                <label>금지 요소</label>
                <textarea name="banned" rows="2" placeholder="예: 공포 표현 금지, 과장 금지"></textarea>
              </div>
              <div class="form-group inline">
                <label><input type="checkbox" name="cta" id="cta-check" /> CTA 포함</label>
                <input name="ctaText" id="cta-text" type="text" placeholder="예: 더 알아보기 · 다운로드" disabled />
              </div>
              <div class="form-actions">
                <button type="reset" class="btn-ghost">초기화</button>
                <button type="submit" class="btn-primary" id="scenario-submit">시나리오 생성</button>
              </div>
            </form>

            <div class="card scenario-results">
              <div class="section-head">
                <h4>생성 결과 (씬 단위)</h4>
                <button class="btn-secondary" id="confirm-scenes">최종 컨펌 → 씬 파이프라인</button>
              </div>
              <div id="scenario-cards" class="scenario-cards">
                <p class="muted">입력 후 “시나리오 생성”을 누르면 결과가 여기에 표시됩니다.</p>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
