<!DOCTYPE html>
<html lang="ko" data-theme="dark" class="layout-fixed">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NK_Studio · AI 이미지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="core.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="store.js" defer></script>
  <script src="api.js" defer></script>
  <script src="js/state.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/service/project.js" defer></script>
  <script src="js/service/brand.js" defer></script>
  <script src="js/ui/common.js" defer></script>
  <script src="js/ui/ai-image.js" defer></script>
</head>

<body class="layout-fixed">
  <div class="grain"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-text">
          <span class="title">NK_Studio</span>
          <span class="subtitle" data-ai-image-subtitle>AI 이미지 생성 플랫폼</span>
        </div>
      </div>
      <nav class="nav">
        <a class="nav-item" href="ai-video.html" data-ai-image-nav="video">AI Video</a>
        <a class="nav-item" href="ai-image.html" data-ai-image-nav="image">AI Image</a>
        <a class="nav-item" href="library.html" data-ai-image-nav="library">콘텐츠 저장소</a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-actions">
          <button class="btn-ghost screen-toggle" data-screen-toggle aria-label="전체 화면" title="전체 화면"></button>
          <button class="btn-ghost theme-toggle" data-theme-toggle aria-label="테마 전환"></button>
          <button class="btn-ghost lang-toggle" data-ai-image-lang-toggle aria-label="언어 전환">EN</button>
        </div>
        <div class="sidebar-version">ver</div>
      </div>
    </aside>

    <div id="auth-overlay" class="auth-overlay hidden">
      <div class="auth-card">
        <p class="auth-title" data-ai-image-auth-title>로그인이 필요합니다.</p>
        <a class="btn-primary no-underline" href="index.html" data-ai-image-auth-link>로그인 하기</a>
      </div>
    </div>

    <main class="main">
      <div class="main-body">
        <section id="ai-image-root"></section>
      </div>
    </main>
  </div>

  <div id="page-loading" class="page-loading hidden" aria-live="polite" aria-busy="true">
    <div class="loading-box">
      <div class="spinner" aria-hidden="true"></div>
      <p>로딩중...</p>
    </div>
  </div>
</body>

</html>
