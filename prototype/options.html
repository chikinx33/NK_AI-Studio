<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NK_Studio · 옵션</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="core.js" defer></script>
  <script src="store.js" defer></script>
  <script src="api.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="grain"></div>
  <div class="app no-sidebar">

    <main class="main">
      <div class="main-body option-body">
        <div class="card option-card">
          <h3 class="option-title">NK AI STUDIO</h3>
          <div class="logo-box">
            <img src="images/logo(500500).png" alt="logo" class="logo-img" />
          </div>
          <div class="form-row">
            <label for="opt-id">ID</label>
            <input type="text" id="opt-id" placeholder="아이디" />
          </div>
          <div class="form-row">
            <label for="opt-pw">PASS</label>
            <input type="password" id="opt-pw" placeholder="비밀번호" />
          </div>
          <p class="muted hidden" id="opt-username" style="text-align:center;"></p>
          <div class="option-actions">
            <button class="btn-primary" id="opt-auth-btn">로그인</button>
          </div>
          <div class="sidebar-version">ver</div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
