<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NK_Studio · 옵션</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="grain"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-text">
          <span class="title" data-i18n="brand_title">NK_Studio</span>
          <span class="subtitle" data-i18n="brand_subtitle">자동화 영상 파이프라인</span>
        </div>
      </div>
      <nav class="nav">
        <a class="nav-item" href="index.html">
          <span class="dot"></span><span data-i18n="nav_dashboard">대시보드</span>
        </a>
        <a class="nav-item" href="scenario.html">
          <span data-i18n="nav_scenario">시나리오 작성</span>
        </a>
        <a class="nav-item" href="scenes.html">
          <span data-i18n="nav_scenes">씬 &amp; 파이프라인</span>
        </a>
        <a class="nav-item active" href="options.html">옵션</a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-actions">
          <button class="btn-ghost icon-btn" aria-label="알림">🔔</button>
          <button class="btn-ghost theme-toggle" data-theme-toggle onclick="toggleTheme()"></button>
          <button class="btn-ghost lang-toggle" data-lang-toggle onclick="toggleLang()">EN</button>
          <a class="btn-ghost icon-btn" aria-label="옵션" href="options.html">⚙️</a>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="main-body option-body">
        <div class="card option-card">
          <div class="logo-box">
            <img src="images/logo(500500).png" alt="logo" class="logo-img" />
          </div>
          <div id="option-logged-out">
            <div class="form-group">
              <label>아이디</label>
              <input type="text" id="opt-id" placeholder="아이디" />
            </div>
            <div class="form-group">
              <label>비밀번호</label>
              <input type="password" id="opt-pw" placeholder="비밀번호" />
            </div>
            <div class="option-actions">
              <button class="btn-primary" id="opt-login-btn">로그인</button>
            </div>
          </div>
          <div id="option-logged-in" class="hidden">
            <p class="muted" id="opt-username"></p>
            <div class="option-actions">
              <button class="btn-secondary" id="opt-logout-btn">로그아웃</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
