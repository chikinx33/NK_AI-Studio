<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NK AI Company</title>
    <!-- PWA: 홈 화면 설치 + 전체화면(앱처럼) -->
    <link rel="manifest" href="/ai-company/manifest.webmanifest" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NK Company" />
    <link rel="apple-touch-icon" href="/ai-company/avatars/core.png" />
    <script type="module" crossorigin src="/ai-company/assets/index-BMScHi4T.js"></script>
    <link rel="stylesheet" crossorigin href="/ai-company/assets/index-u99ZlFB2.css">
  </head>
  <body>
    <!-- 버전 표시용 NK 설정 로드(window.NK.config.APP_VERSION) -->
    <script src="/js/config.js"></script>
    <div id="root">
      <div id="nk-ai-bootstrap" style="min-height:100vh;display:grid;place-items:center;background:#0f1115;color:#d1d5db;font-family:system-ui,sans-serif">
        <div style="max-width:420px;padding:32px;text-align:center">
          <div id="nk-ai-bootstrap-title" style="font-size:15px;font-weight:700">AI 기업을 불러오는 중입니다…</div>
          <div id="nk-ai-bootstrap-actions" style="display:none;margin-top:16px;gap:8px;justify-content:center">
            <button type="button" onclick="location.reload()" style="cursor:pointer;border:1px solid #374151;border-radius:8px;background:#1f2937;color:#fff;padding:9px 14px">다시 불러오기</button>
            <a href="/app" style="border:1px solid #374151;border-radius:8px;color:#9ca3af;padding:9px 14px;text-decoration:none">로그인 화면</a>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        var fallback = document.getElementById("nk-ai-bootstrap");
        if (!fallback) return;
        var title = document.getElementById("nk-ai-bootstrap-title");
        var actions = document.getElementById("nk-ai-bootstrap-actions");
        if (title) title.textContent = "AI 기업을 불러오지 못했습니다.";
        if (actions) actions.style.display = "flex";
      }, 8000);
    </script>
  </body>
</html>
