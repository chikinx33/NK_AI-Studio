<!DOCTYPE html>
<html lang="ko" data-theme="dark" class="layout-fixed preload-veiled">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NK_Studio · 대시보드</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    html.preload-veiled, body.preload-veiled { background:#0f172a; color:#cbd5e1; }
    html.preload-veiled .app, html.preload-veiled .main { visibility:hidden; }
  </style>
  <script>
    (function () {
      try {
        var h = (new URLSearchParams(location.search)).get('host') || '';
        h = String(h).toLowerCase();
        var cls = '';
        if (h === 'brand') cls = 'page-shell-brand';
        else if (h === 'image') cls = 'page-shell-image';
        else if (h === 'video') cls = 'page-shell-video';
        else {
          var ref = (document.referrer || '').toLowerCase();
          if (/brand-studio\.html|brand\.html|knowledge\.html|analytics\.html/.test(ref)) cls = 'page-shell-brand';
          else if (/ai-image\.html|ai-image-stage\.html/.test(ref)) cls = 'page-shell-image';
          else cls = 'page-shell-video';
        }
        if (cls && document.documentElement && !document.documentElement.classList.contains(cls)) {
          document.documentElement.classList.add(cls);
        }
      } catch (_) { }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=3.1608" />
  <link rel="stylesheet" href="styles.dashboard-cards.css?v=3.1608" />
  <script src="core.js?v=3.1608" defer></script>
  <script src="js/config.js?v=3.1608" defer></script>
  <script src="js/utils.js?v=3.1608" defer></script>
  <script src="store.js?v=3.1608" defer></script>
  <script src="api.js?v=3.1608" defer></script>
  <script src="js/state.js?v=3.1608" defer></script>
  <script src="js/auth.js?v=3.1608" defer></script>
  <script src="js/navigation.js?v=3.1608" defer></script>
  <script src="js/service/media.js?v=3.1608" defer></script>
  <script src="js/service/project.js?v=3.1608" defer></script>
  <script src="js/service/character-traits.js?v=3.1608" defer></script>
  <script src="js/service/brand.js?v=3.1608" defer></script>
  <script src="js/service/content-library.js?v=3.1608" defer></script>
  <script src="js/ui/common.js?v=3.1608" defer></script>
  <script src="js/ui/dashboard.js?v=3.1608" defer></script>
  <script src="js/ui/scenario.js?v=3.1608" defer></script>
  <script src="js/ui/production.js?v=3.1608" defer></script>
  <script src="script.js?v=3.1608" defer></script>
</head>

<body class="layout-fixed">
  <div class="grain"></div>
  <div class="app no-sidebar">
    <div id="project-overlay" class="auth-overlay hidden">
      <div class="auth-card">
        <p class="auth-title">프로젝트 생성</p>
        <div class="form-row">
          <input id="project-name-input" placeholder="에피소드 이름" />
        </div>
        <div class="option-actions">
          <button id="project-cancel" class="btn-secondary">취소</button>
          <button id="project-create" class="btn-primary">생성</button>
        </div>
      </div>
    </div>
    <div id="auth-overlay" class="auth-overlay hidden">
      <div class="auth-card">
        <p class="auth-title">로그인 하세요.</p>
        <a class="btn-primary no-underline" href="app.html">로그인 하기</a>
      </div>
    </div>
    <main class="main">
      <div class="main-body">
        <section class="content">
          <div class="projects">
            <div id="dashboard-drafts" class="draft-card-grid"></div>
            <div id="dashboard-loading" class="loading-overlay hidden">
              <div class="spinner"></div>
              <p>프로젝트 불러오는 중...</p>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>
