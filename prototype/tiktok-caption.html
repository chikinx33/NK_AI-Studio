<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>TikTok 글 복사</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px 16px 40px;
      background: #140d24; color: #f3eefc;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    .sub { margin: 0 0 18px; color: #b9aed1; font-size: 14px; line-height: 1.55; }
    .caption {
      white-space: pre-wrap; word-break: break-word; font-size: 15px; line-height: 1.6;
      background: #221838; border: 1px solid #3d2f5c; border-radius: 12px; padding: 14px; margin: 0 0 16px;
      user-select: text; -webkit-user-select: text;
    }
    button {
      width: 100%; min-height: 54px; border: 0; border-radius: 12px; font-size: 17px; font-weight: 700;
      background: #ff8a1f; color: #1b1027; cursor: pointer;
    }
    button.is-copied { background: #22c55e; }
    .steps { margin: 18px 0 0; padding-left: 20px; color: #b9aed1; font-size: 14px; line-height: 1.7; }
    .msg { color: #fca5a5; font-size: 15px; line-height: 1.6; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1 id="tt-title"></h1>
    <p class="sub" id="tt-sub"></p>
    <p class="msg" id="tt-msg" hidden></p>
    <div id="tt-body" hidden>
      <pre class="caption" id="tt-caption"></pre>
      <button type="button" id="tt-copy"></button>
      <ol class="steps" id="tt-steps"></ol>
    </div>
  </main>
  <script>
    (function () {
      var lang = /^ko/i.test(navigator.language || '') ? 'ko' : 'en';
      var DICT = {
        ko: {
          title: 'TikTok 게시글 복사',
          sub: '영상 초안에는 TikTok 정책상 글이 함께 실리지 않아요. 아래 글을 복사해서 붙여 넣어 주세요.',
          loading: '글을 불러오는 중…',
          copy: '글 복사',
          copied: '복사됨 — TikTok 에 붙여 넣으세요',
          copyFail: '복사하지 못했어요. 글을 길게 눌러 직접 복사해 주세요.',
          steps: ['TikTok 앱 아래 \'받은 알림함(Inbox)\'에서 업로드 알림을 누르세요.', '편집 화면의 설명 칸을 길게 눌러 붙여 넣으세요.', '공개 범위를 고른 뒤 \'게시\'를 누르세요.'],
          expired: '링크 기간이 지났어요. 스튜디오에서 다시 보내 주세요.',
          notFound: '저장된 글을 찾지 못했어요.',
          bad: '올바르지 않은 링크예요.',
          fail: '글을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.'
        },
        en: {
          title: 'Copy your TikTok caption',
          sub: 'TikTok does not carry text with video drafts. Copy the caption below and paste it in the TikTok app.',
          loading: 'Loading caption…',
          copy: 'Copy caption',
          copied: 'Copied — paste it in TikTok',
          copyFail: 'Could not copy. Long-press the text to copy it manually.',
          steps: ['In the TikTok app, open Inbox and tap the upload notification.', 'Long-press the description field and paste.', 'Choose who can view it, then tap Post.'],
          expired: 'This link has expired. Send the draft again from the studio.',
          notFound: 'The saved caption could not be found.',
          bad: 'This link is not valid.',
          fail: 'Could not load the caption. Please try again shortly.'
        }
      };
      var T = DICT[lang];
      document.documentElement.lang = lang;
      document.title = T.title;
      var $ = function (id) { return document.getElementById(id); };
      $('tt-title').textContent = T.title;
      $('tt-sub').textContent = T.loading;

      function showError(text) {
        $('tt-sub').textContent = '';
        $('tt-msg').textContent = text;
        $('tt-msg').hidden = false;
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text).catch(function () { return legacyCopy(text); });
        }
        return legacyCopy(text);
      }
      function legacyCopy(text) {
        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '-1000px';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, text.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (_) {}
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy'));
        });
      }

      fetch('/api/sns/tiktok/caption' + location.search, { cache: 'no-store' })
        .then(function (r) { return r.json().catch(function () { return { ok: false, error: 'fail' }; }); })
        .then(function (data) {
          if (!data || !data.ok) {
            var e = data && data.error;
            showError(e === 'expired' ? T.expired : (e === 'not_found' ? T.notFound : (e === 'bad_link' ? T.bad : T.fail)));
            return;
          }
          var caption = String(data.caption || '');
          $('tt-sub').textContent = T.sub;
          $('tt-caption').textContent = caption;
          var btn = $('tt-copy');
          btn.textContent = T.copy;
          T.steps.forEach(function (s) {
            var li = document.createElement('li');
            li.textContent = s;
            $('tt-steps').appendChild(li);
          });
          btn.addEventListener('click', function () {
            copyText(caption).then(function () {
              btn.textContent = T.copied;
              btn.classList.add('is-copied');
            }).catch(function () {
              btn.textContent = T.copyFail;
            });
          });
          $('tt-body').hidden = false;
        })
        .catch(function () { showError(T.fail); });
    })();
  </script>
</body>
</html>
