  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="core.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="store.js" defer></script>

<body class="layout-fixed">
  <div class="grain"></div>
  <div class="app no-sidebar">
    <main class="main">
      <div class="main-body">
        <section id="knowledge-hub-root"></section>
      </div>
    </main>
  </div>
  <div id="lib-modal" class="img-modal hidden">
    <div class="card lib-content"></div>
  </div>
  <div id="character-manager-modal" class="img-modal hidden">
    <div class="img-modal__inner character-manager-modal-box">
      <div class="card character-manager-modal-content" id="character-manager-modal-content"></div>
    </div>
  </div>
  <div id="page-loading" class="page-loading hidden" aria-live="polite" aria-busy="true">
    <div class="loading-box">
      <div class="spinner" aria-hidden="true"></div>
      <p>로딩중...</p>
    </div>
  </div>
