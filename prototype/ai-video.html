<!DOCTYPE html>
<html lang="ko" data-theme="dark" class="layout-fixed">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NK_Studio · AI Video</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="core.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="store.js" defer></script>
  <script src="api.js" defer></script>
  <script src="js/state.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/navigation.js" defer></script>
  <script src="js/service/media.js" defer></script>
  <script src="js/service/project.js" defer></script>
  <script src="js/service/content-library.js" defer></script>
  <script src="js/ui/common.js" defer></script>
  <script src="js/ui/dashboard.js" defer></script>
  <script src="js/ui/scenario.js" defer></script>
  <script src="js/ui/production.js" defer></script>
  <script src="script.js" defer></script>
</head>

<body class="layout-fixed">
  <div class="grain"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-text">
          <span class="title" data-i18n="brand_title">NK_Studio</span>
          <span class="subtitle" data-i18n="brand_subtitle">자동화 영상 파이프라인</span>
        </div>
      </div>
      <nav class="nav">
        <a class="nav-item" href="dashboard.html">
          <span data-i18n="nav_dashboard">대시보드</span>
        </a>
        <a class="nav-item" href="library.html">
          <span data-i18n="nav_library">콘텐츠 저장소</span>
        </a>
        <a class="nav-item" href="brand.html">
          <span data-i18n="nav_brand">Brand Studio</span>
        </a>
        <a class="nav-item" href="knowledge.html">
          <span data-i18n="nav_knowledge">Knowledge Hub</span>
        </a>
        <a class="nav-item" href="analytics.html">
          <span data-i18n="nav_analytics">Analytics</span>
        </a>
      </nav>
      <div id="sidebar-project-card" class="sidebar-project-card" style="display: none;"></div>
      <div class="sidebar-footer">
        <div class="sidebar-actions">
          <button class="btn-ghost icon-btn" aria-label="알림">🔔</button>
          <button class="btn-ghost theme-toggle" data-theme-toggle onclick="toggleTheme('global')"></button>
          <button class="btn-ghost lang-toggle" data-lang-toggle onclick="toggleLang()">EN</button>
          <a class="btn-ghost icon-btn" aria-label="옵션" href="index.html" data-action="open-options">⚙️</a>
        </div>
        <div class="sidebar-version">ver</div>
      </div>
    </aside>

    <div id="project-overlay" class="auth-overlay hidden">
      <div class="auth-card">
        <p class="auth-title">프로젝트 생성</p>
        <div class="form-row">
          <label>이름</label>
          <input id="project-name-input" placeholder="프로젝트 이름" />
        </div>
        <div class="option-actions">
          <button id="project-cancel" class="btn-secondary">취소</button>
          <button id="project-create" class="btn-primary">생성</button>
        </div>
      </div>
    </div>

    <div id="auth-overlay" class="auth-overlay hidden">
      <div class="auth-card">
        <p class="auth-title">로그인 하세요.</p>
        <a class="btn-primary no-underline" href="index.html">로그인 하기</a>
      </div>
    </div>

    <main class="main blur-target">
      <div class="main-body">
        <section class="content"></section>
      </div>
    </main>
  </div>
</body>

</html>
