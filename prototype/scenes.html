<!DOCTYPE html>
<html lang="ko" data-theme="dark" class="layout-fixed">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NK_Studio · 프로덕션</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="core.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="store.js" defer></script>
  <script src="api.js" defer></script>
  <script src="js/state.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/navigation.js" defer></script>
  <script src="js/service/media.js" defer></script>
  <script src="js/service/project.js" defer></script>
  <script src="js/service/character-registry.js" defer></script>
  <script src="js/service/content-library.js" defer></script>
  <script src="js/ui/common.js" defer></script>
  <script src="js/ui/dashboard.js" defer></script>
  <script src="js/ui/scenario.js" defer></script>
  <script src="ui/pipeline-scene-row.js" defer></script>
  <script src="ui/pipeline-scene-actions.js" defer></script>
  <script src="ui/pipeline-assets.js" defer></script>
  <script src="ui/pipeline-video.js" defer></script>
  <script src="ui/pipeline-image.js" defer></script>
  <script src="ui/pipeline-media.js" defer></script>
  <script src="ui/pipeline.js" defer></script>
  <script src="script.js" defer></script>
</head>

<body class="layout-fixed">
  <div class="grain"></div>
  <div class="app no-sidebar">

    <div id="auth-overlay" class="auth-overlay hidden">
      <div class="auth-card">
        <p class="auth-title">로그인 하세요.</p>
        <a class="btn-primary no-underline" href="index.html">로그인 하기</a>
      </div>
    </div>

    <main class="main blur-target">
      <div class="main-body">
        <section class="scenario-section" id="pipeline-section">
          <div style="margin-bottom:12px;" id="pipeline-meta">
          </div>
          <div class="card scenario-results" id="pipeline-card">
            <div id="pipeline-scenes" class="scenario-cards"></div>
            <div id="pipeline-loading" class="loading-overlay hidden">
              <div class="spinner"></div>
              <p>작업 중...</p>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="img-modal" class="img-modal hidden">
    <img src="" alt="preview" />
  </div>
  <div id="video-modal" class="img-modal hidden">
    <video controls autoplay></video>
  </div>
  <div id="lib-modal" class="img-modal hidden">
    <div class="card lib-content"></div>
  </div>
</body>

</html>
