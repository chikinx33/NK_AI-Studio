<!DOCTYPE html>
<html lang="ko" data-theme="dark" class="layout-fixed preload-veiled">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NK_Studio · 회원 관리</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    html.preload-veiled, body.preload-veiled { background:#0f172a; color:#cbd5e1; }
    html.preload-veiled .app, html.preload-veiled .main { visibility:hidden; }

    /* 회원 관리 전용 스타일 (페이지 스코프) — 테마 변수 사용으로 라이트/다크 모두 대응 */
    /* 표(6열)가 가로 스크롤 없이 들어가도록 넓게. 화면이 좁으면 화면 폭을 그대로 쓴다. */
    .admin-page { width:100%; max-width:1440px; margin:0 auto; padding:28px 16px 40px; box-sizing:border-box; }
    /* 카드 내부 여백: 검색/카테고리/리스트가 박스 모서리에 붙지 않도록 */
    .admin-list-card .admin-card-inner { padding:20px 22px 22px; }
    /* 검색·필터는 표 아래 페이지 줄 왼쪽에 함께 놓는다(위에 두면 표가 밀려 세로 스크롤이 생긴다) */
    .admin-list-foot { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:12px; }
    .admin-list-foot .admin-pager-host { margin-left:auto; }
    .admin-list-foot .admin-pager { margin-top:0; }
    .admin-toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0; }
    .admin-toolbar .admin-search { flex:0 0 auto; }
    .admin-toolbar .admin-search input { width:220px; }
    .admin-toolbar select { width:132px; }
    .admin-toolbar input, .admin-toolbar select {
      padding:7px 10px; border-radius:9px; border:1px solid var(--border);
      background:var(--studio-input-bg, var(--panel)); color:var(--text); font-size:13px;
    }
    .admin-toolbar input::placeholder { color:var(--muted); }
    .admin-toolbar select option { color:#111; background:#fff; }
    .admin-table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:14px; background:var(--panel); }
    table.admin-table { width:100%; border-collapse:collapse; font-size:14px; min-width:640px; }
    /* 행은 항상 한 줄 — 넘치는 내용은 줄이거나(…) 접고, 전체는 title 로 확인한다. */
    table.admin-table th, table.admin-table td {
      padding:9px 10px; text-align:left; border-bottom:1px solid var(--border); color:var(--text);
      white-space:nowrap; vertical-align:middle;
    }
    table.admin-table th { font-weight:600; color:var(--muted); font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; }
    table.admin-table tr:last-child td { border-bottom:none; }
    table.admin-table tbody tr:hover { background:var(--layer-strong); }

    .admin-badge { display:inline-block; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }
    .admin-badge--admin { background:rgba(245,158,11,.16); color:#fbbf24; }
    .admin-badge--member { background:rgba(96,165,250,.16); color:#93c5fd; }
    .admin-badge--on { background:rgba(34,197,94,.18); color:#4ade80; }
    .admin-badge--off { background:rgba(148,163,184,.18); color:#cbd5e1; }
    .admin-perm-chip { display:inline-block; margin:0 3px 0 0; padding:2px 7px; border-radius:8px; font-size:12px; background:rgba(148,163,184,.16); color:var(--text); }
    .admin-perm-chip--more { cursor:help; color:var(--muted); }

    /* 라이트 테마: 라벨/칩 가독성 보정 (어두운 글씨 + 적당한 배경) */
    [data-theme="light"] .admin-badge--admin { background:rgba(245,158,11,.18); color:#b45309; }
    [data-theme="light"] .admin-badge--member { background:rgba(37,99,235,.14); color:#1d4ed8; }
    [data-theme="light"] .admin-badge--on { background:rgba(34,197,94,.16); color:#15803d; }
    [data-theme="light"] .admin-badge--off { background:rgba(100,116,139,.16); color:#475569; }
    [data-theme="light"] .admin-perm-chip { background:rgba(100,116,139,.14); color:#334155; }

    /* 이름 + 이메일을 한 줄에. 좁아지면 이메일부터 … 로 줄인다. */
    /* 이름 열은 폭을 묶어 둔다 — 긴 이메일이 표 전체를 밀어 가로 스크롤을 만들었다.
       (td 의 max-width 는 table-layout:auto 에서 무시되므로 내부 span 에 건다) */
    .admin-name-cell { display:inline-flex; align-items:baseline; gap:8px; max-width:240px; }
    .admin-row-name { flex:0 0 auto; }
    .admin-row-email { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; font-size:12px; color:var(--muted, #94a3b8); }
    .admin-row-sub { margin-left:8px; font-size:12px; color:var(--muted, #94a3b8); }

    .admin-row-actions { display:flex; flex-wrap:nowrap; gap:6px; }

    /* 정사각형 아이콘 버튼 (홈/신규/새로고침/행 액션 공용) */
    .admin-sq-btn {
      width:40px; height:40px; flex:0 0 40px; display:inline-flex; align-items:center; justify-content:center;
      border:1px solid var(--border); background:var(--panel); color:var(--text);
      border-radius:10px; cursor:pointer; padding:0; transition:background .18s ease, filter .18s ease;
    }
    .admin-sq-btn svg { width:20px; height:20px; display:block; }
    .admin-sq-btn:hover { background:var(--layer-strong); }
    .admin-sq-btn--primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    .admin-sq-btn--primary:hover { background:var(--accent); filter:brightness(1.08); }

    /* 행 내 수정/삭제 버튼(텍스트형) */
    .admin-icon-btn {
      border:1px solid var(--border); background:var(--panel); color:var(--text);
      border-radius:8px; padding:5px 10px; cursor:pointer; font-size:13px; white-space:nowrap; flex:0 0 auto;
    }
    .admin-icon-btn:hover { background:var(--layer-strong); }
    .admin-icon-btn--danger:hover { background:rgba(239,68,68,.18); color:#ef4444; border-color:rgba(239,68,68,.45); }
    .admin-empty, .admin-error { padding:28px; text-align:center; color:var(--muted); }
    .admin-error { color:#ef4444; }
    /* 하단 페이지 이동 */
    .admin-pager-host:empty { display:none; }
    .admin-pager { display:flex; justify-content:center; align-items:center; gap:6px; flex-wrap:wrap; margin-top:16px; }
    .admin-pager-btn {
      min-width:34px; height:34px; padding:0 10px; border:1px solid var(--border); border-radius:9px;
      background:var(--panel); color:var(--text); font-size:13px; line-height:1; cursor:pointer;
      transition:background .15s ease, border-color .15s ease, color .15s ease;
    }
    .admin-pager-btn:hover:not(:disabled) { background:var(--layer-strong); border-color:var(--accent); }
    .admin-pager-btn.is-current { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
    .admin-pager-btn:disabled { opacity:.35; cursor:not-allowed; }
    .admin-pager-gap { min-width:20px; text-align:center; color:var(--muted); font-size:13px; }

    .admin-version { text-align:center; color:var(--muted); font-size:12px; opacity:.75; margin-top:18px; }

    /* 모달 */
    .admin-modal-backdrop {
      position:fixed; inset:0; background:rgba(2,6,23,.5); backdrop-filter:blur(3px);
      display:flex; align-items:center; justify-content:center; z-index:60; padding:20px;
    }
    .admin-modal {
      width:100%; max-width:460px; background:var(--panel); border:1px solid var(--border);
      color:var(--text); border-radius:16px; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.35);
    }
    .admin-modal h3 { margin:0 0 16px; font-size:18px; }
    .admin-field { margin-bottom:14px; }
    .admin-field label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
    .admin-field input[type="text"], .admin-field input[type="password"], .admin-field input[type="email"], .admin-field input[type="number"] {
      width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
      background:var(--studio-input-bg, var(--panel)); color:var(--text); font-size:14px; box-sizing:border-box;
    }
    .admin-field input::placeholder { color:var(--muted); }
    .admin-field input:disabled { opacity:.55; cursor:not-allowed; }
    .admin-perms { display:flex; flex-wrap:wrap; gap:10px; }
    .admin-perms label { display:flex; align-items:center; gap:6px; font-size:14px; color:var(--text); cursor:pointer; }
    .admin-perms input[type="checkbox"] { width:16px; height:16px; }
    /* 활성 계정 토글: 동그란 체크박스 + 체크 시 초록 */
    .admin-check-round {
      appearance:none; -webkit-appearance:none; -moz-appearance:none;
      width:22px; height:22px; flex:0 0 22px; border-radius:50%;
      border:2px solid var(--border); background:var(--panel);
      cursor:pointer; position:relative; transition:background .15s ease, border-color .15s ease;
    }
    .admin-check-round:checked { background:#22c55e; border-color:#22c55e; }
    .admin-check-round:checked::after {
      content:''; position:absolute; left:6px; top:2px;
      width:5px; height:10px; border:solid #fff; border-width:0 2px 2px 0;
      transform:rotate(45deg);
    }
    .admin-check-round:focus-visible { outline:2px solid #22c55e; outline-offset:2px; }
    .admin-modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
    .admin-hint { font-size:12px; color:var(--muted); margin-top:4px; }
    .admin-modal-error { color:#ef4444; font-size:13px; margin-top:10px; min-height:18px; }
    .admin-status { font-size:13px; color:#16a34a; }
    .admin-credit-cell { display:flex; align-items:center; gap:6px; white-space:nowrap; }
    .admin-credit-load-error { margin:0 0 14px; padding:12px 14px; border:1px solid rgba(239,68,68,.35); border-radius:10px; background:rgba(239,68,68,.08); }
    .admin-credit-cell > strong { color:#fbbf24; font-size:14px; }
    .admin-credit-cell > small { color:var(--muted); font-size:11px; cursor:help; }
    .admin-credit-actions { display:flex; gap:4px; }
    .admin-credit-actions button { border:1px solid var(--border); border-radius:6px; padding:3px 6px; background:transparent; color:var(--muted); font-size:10px; cursor:pointer; }
    .admin-credit-actions button:hover { color:var(--text); border-color:var(--accent); }
    .admin-credit-modal { max-width:860px; }
    .admin-credit-summary { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
    .admin-credit-summary span { padding:12px; border-radius:10px; background:var(--layer-strong); color:var(--muted); font-size:12px; }
    .admin-credit-summary b { display:block; margin-top:4px; color:var(--text); font-size:15px; }
    .admin-credit-history { max-height:420px; overflow:auto; border:1px solid var(--border); border-radius:10px; }
    .admin-credit-history table { width:100%; border-collapse:collapse; font-size:11px; }
    .admin-credit-history th, .admin-credit-history td { padding:8px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; }
    .admin-credit-history td:nth-child(3) { min-width:160px; white-space:normal; }
    .admin-credit-history td.is-plus { color:#4ade80; }
  </style>

<body class="layout-fixed">
  <div class="grain"></div>
  <div class="app no-sidebar">
    <div id="auth-overlay" class="auth-overlay hidden">
      <div class="auth-card">
        <p class="auth-title">로그인 하세요.</p>
        <a class="btn-primary no-underline" href="app.html">로그인 하기</a>
      </div>
    </div>
    <main class="main">
      <div class="main-body">
        <section class="content"></section>
      </div>
    </main>
  </div>
  <div id="page-loading" class="page-loading hidden" aria-live="polite" aria-busy="true">
    <div class="loading-box">
      <div class="spinner" aria-hidden="true"></div>
      <p>로딩중...</p>
    </div>
  </div>
</body>
