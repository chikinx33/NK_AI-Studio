<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <linearGradient id="grad" x1="120" y1="250" x2="900" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff7a00"/>
      <stop offset="0.5" stop-color="#ff5d7a"/>
      <stop offset="1" stop-color="#5c7cff"/>
    </linearGradient>
    <radialGradient id="g1" cx="0" cy="0" r="1" gradientTransform="translate(150 40) scale(560)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff7a00" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff7a00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0" cy="0" r="1" gradientTransform="translate(1080 80) scale(620)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5c7cff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5c7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0" cy="0" r="1" gradientTransform="translate(600 760) scale(640)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0bbfa5" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0bbfa5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <rect width="1200" height="630" fill="url(#g3)"/>

  <!-- 로고 마크 -->
  <g transform="translate(90 78)">
    <rect width="64" height="64" rx="14" fill="#000"/>
    <path d="M16 50V18l24 32V18 M40 34l18-16 M40 34l20 16" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="42" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="700" fill="#eef2fb">NK AI Studio</text>
  </g>

  <!-- 메인 카피 -->
  <text x="90" y="270" font-family="'Space Grotesk', sans-serif" font-size="68" font-weight="700" fill="#eef2fb">기획부터 SNS 배포까지,</text>
  <text x="90" y="356" font-family="'Space Grotesk', sans-serif" font-size="68" font-weight="700" fill="url(#grad)">한 흐름의 AI 스튜디오</text>

  <text x="92" y="420" font-family="'Space Grotesk', sans-serif" font-size="27" font-weight="500" fill="#b9c6e0">시나리오 · 이미지 · 영상 · 사운드 생성부터 6개 채널 자동 배포까지</text>

  <!-- 파이프라인 칩 -->
  <g font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="600">
    <g transform="translate(92 480)">
      <rect width="120" height="52" rx="14" fill="#0e1730" stroke="#1b2845"/>
      <text x="60" y="34" text-anchor="middle" fill="#eef2fb">기획</text>
    </g>
    <g transform="translate(232 480)">
      <rect width="120" height="52" rx="14" fill="#0e1730" stroke="#1b2845"/>
      <text x="60" y="34" text-anchor="middle" fill="#eef2fb">생성</text>
    </g>
    <g transform="translate(372 480)">
      <rect width="120" height="52" rx="14" fill="#0e1730" stroke="#1b2845"/>
      <text x="60" y="34" text-anchor="middle" fill="#eef2fb">편집</text>
    </g>
    <g transform="translate(512 480)">
      <rect width="160" height="52" rx="14" fill="#0e1730" stroke="#ff7a0066"/>
      <text x="80" y="34" text-anchor="middle" fill="#ff9a3c">SNS 배포</text>
    </g>
  </g>

  <!-- 우측 장식 카드 -->
  <g transform="translate(820 150)" opacity="0.96">
    <rect width="300" height="330" rx="22" fill="#111d3a" stroke="#1b2845"/>
    <rect x="0" y="0" width="300" height="46" rx="22" fill="#0e1730"/>
    <circle cx="26" cy="23" r="6" fill="#ff5f57"/><circle cx="48" cy="23" r="6" fill="#febc2e"/><circle cx="70" cy="23" r="6" fill="#28c840"/>
    <rect x="28" y="78" width="80" height="80" rx="14" fill="#5c7cff22" stroke="#ffffff14"/>
    <path d="M50 118h36 M68 100v36" stroke="#5c7cff" stroke-width="4" stroke-linecap="round"/>
    <rect x="128" y="86" width="140" height="12" rx="6" fill="#ffffff18"/>
    <rect x="128" y="112" width="96" height="12" rx="6" fill="#ffffff12"/>
    <rect x="128" y="138" width="120" height="12" rx="6" fill="#ff7a00"/>
    <rect x="28" y="196" width="240" height="12" rx="6" fill="#ffffff14"/>
    <rect x="28" y="222" width="180" height="12" rx="6" fill="#ffffff10"/>
    <g transform="translate(28 264)">
      <rect width="70" height="40" rx="12" fill="#0bbfa522" stroke="#ffffff14"/>
      <rect x="84" width="70" height="40" rx="12" fill="#ff7a0022" stroke="#ffffff14"/>
      <rect x="168" width="70" height="40" rx="12" fill="#5c7cff22" stroke="#ffffff14"/>
    </g>
  </g>
</svg>
