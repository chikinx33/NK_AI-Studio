<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NK_Studio · Automation Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="grain"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-text">
          <span class="title" data-i18n="brand_title">NK_Studio</span>
          <span class="subtitle" data-i18n="brand_subtitle">자동화 영상 파이프라인</span>
        </div>
      </div>
      <nav class="nav">
        <a class="nav-item active" href="#">
          <span data-i18n="nav_dashboard">대시보드</span>
        </a>
        <a class="nav-item" id="scenario-link" href="scenario.html">
          <span data-i18n="nav_scenario">시나리오 작성</span>
        </a>
        <a class="nav-item" href="scenes.html"><span data-i18n="nav_scenes">씬 & 파이프라인</span></a>
        <a class="nav-item" href="#"><span data-i18n="nav_media">영상 편집</span></a>
        <a class="nav-item" href="#"><span data-i18n="nav_publish">배포</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-actions">
          <button class="btn-ghost icon-btn" aria-label="알림">🔔</button>
          <button class="btn-ghost theme-toggle" data-theme-toggle onclick="toggleTheme()"></button>
          <button class="btn-ghost lang-toggle" data-lang-toggle onclick="toggleLang()">EN</button>
          <a class="btn-ghost icon-btn" aria-label="옵션" href="options.html">⚙️</a>
        </div>
        <div class="sidebar-version">ver 1.027</div>
      </div>
    </aside>

    <div id="auth-overlay" class="auth-overlay hidden">
      <div class="auth-card">
        <p class="auth-title">로그인 하세요.</p>
        <a class="btn-primary no-underline" href="options.html">로그인 하기</a>
      </div>
    </div>

    <main class="main blur-target">
      <div class="main-body">

        <section class="content">
          <div class="projects">
          <div class="section-head">
            <h3>저장된 프로젝트</h3>
          </div>
          <div id="dashboard-drafts" class="draft-card-grid"></div>
          </div>
        </section>
      </section>
      </div>
    </main>
  </div>
</body>
</html>
