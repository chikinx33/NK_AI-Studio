<!DOCTYPE html>
<html lang="ko" data-theme="dark" class="layout-fixed">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NK_Studio 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="styles.landing.css" />
  <script src="core.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="store.js" defer></script>
  <script src="api.js" defer></script>
  <script src="js/state.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/navigation.js" defer></script>
  <script src="js/service/media.js" defer></script>
  <script src="js/service/project.js" defer></script>
  <script src="js/service/content-library.js" defer></script>
  <script src="js/ui/common.js" defer></script>
  <script src="js/ui/dashboard.js" defer></script>
  <script src="js/ui/scenario.js" defer></script>
  <script src="js/ui/production.js" defer></script>
  <script src="script.js" defer></script>
</head>

<body class="layout-fixed">
  <div class="grain"></div>
  <div class="app no-sidebar">
    <main class="main">
      <div class="main-body option-body">
        <div class="login-icons" id="login-icons" aria-hidden="true">
          <a href="brand-studio.html" class="login-icon-link">
            <img src="images/icon-ai-branding.png" alt="브랜드 스튜디오로 이동" />
          </a>
          <a href="ai-video.html?stage=dashboard" class="login-icon-link">
            <img src="images/icon-ai-video.png" alt="영상 제작 메인으로 이동" />
          </a>
          <a href="ai-image.html?stage=dashboard" class="login-icon-link">
            <img src="images/icon-ai-image.png" alt="이미지 생성 메인으로 이동" />
          </a>
          <img src="images/icon-ai-sound.png" alt="" class="is-disabled" aria-disabled="true" />
          <img src="images/icon-ai-doc.png" alt="" class="is-disabled" aria-disabled="true" />
        </div>

        <div class="option-card-grid">
          <div class="card option-card" id="login-card">
            <h3 class="option-title" id="login-card-title">NK AI STUDIO</h3>
            <div class="logo-box">
              <img src="images/logo(500500).png" alt="logo" class="logo-img" id="login-card-logo" />
              <input type="file" id="login-icon-file" class="login-brand-file-input" accept="image/*" />
            </div>
            <form id="opt-login-form" onsubmit="return false;" autocomplete="on" novalidate>
              <div class="form-row">
                <label for="opt-id">ID</label>
                <input type="text" id="opt-id" placeholder="아이디" autocomplete="username" />
              </div>
              <div class="form-row">
                <label for="opt-pw">PASS</label>
                <input type="password" id="opt-pw" placeholder="비밀번호" autocomplete="current-password" />
              </div>
              <p class="muted hidden" id="opt-username" style="text-align:center;"></p>
              <div class="option-actions">
                <button class="btn-primary" id="opt-auth-btn" data-i18n-skip="1">로그인</button>
              </div>
            </form>
            <div class="sidebar-actions option-card-toolbar">
              <button class="btn-ghost screen-toggle" data-screen-toggle onclick="toggleScreenMode()" aria-label="전체 화면" title="전체 화면"></button>
              <button class="btn-ghost lang-toggle" data-lang-toggle onclick="toggleLang('local')" aria-label="언어 전환">KO</button>
              <button class="btn-ghost theme-toggle" data-theme-toggle onclick="toggleTheme('local')" aria-label="테마 전환"></button>
            </div>
            <div class="sidebar-version">ver</div>
          </div>

          <section class="card option-card favorite-card is-locked" id="favorite-card" aria-live="polite">
            <div class="favorite-list empty" id="favorite-list" role="list"></div>
            <div class="favorite-pagination hidden" id="favorite-pagination" aria-label="즐겨찾기 페이지 이동"></div>
            <div class="favorite-transfer-box hidden" id="favorite-transfer-box" aria-label="다른 페이지로 이동" title="다른 페이지 빈 칸으로 이동"></div>
          </section>

          <section class="card option-card user-dashboard-card is-locked" id="user-dashboard-card" aria-live="polite">

            <section class="user-dashboard-panel hidden" id="user-dashboard-panel">
              <article class="user-widget subscription-widget is-collapsed" id="subscription-widget">
                <div class="user-widget-head">
                  <h4>구독 현황</h4>
                  <button type="button" class="subscription-toggle" id="subscription-toggle" aria-expanded="false" aria-label="구독 현황 펼치기"></button>
                </div>
                <div class="subscription-body">
                  <div class="subscription-grid">
                    <div class="subscription-item">
                      <span class="muted">플랜</span>
                      <strong id="subscription-plan">Free</strong>
                    </div>
                    <div class="subscription-item">
                      <span class="muted">상태</span>
                      <strong id="subscription-status">미연결</strong>
                    </div>
                    <div class="subscription-item">
                      <span class="muted">갱신일</span>
                      <strong id="subscription-renew">-</strong>
                    </div>
                  </div>
                  <p class="muted user-widget-help">결제 연동 전 단계라 현재는 UI만 표시됩니다.</p>
                  <button type="button" class="btn-secondary" id="subscription-manage-btn">구독 관리(준비중)</button>
                </div>
              </article>

              <form class="user-widget favorite-widget favorite-form is-collapsed hidden" id="favorite-form">
                <div class="user-widget-head">
                  <h4>즐겨찾기 등록</h4>
                  <button type="button" class="favorite-form-toggle" id="favorite-form-toggle" aria-expanded="false" aria-label="즐겨찾기 등록 펼치기"></button>
                </div>
                <div class="favorite-form-body">
                  <div class="fav-form-row">
                    <label for="favorite-title">메뉴 이름</label>
                    <input type="text" id="favorite-title" placeholder="아이콘 아래 표시될 이름" maxlength="40" required />
                  </div>
                  <div class="fav-form-row">
                    <label for="favorite-category-select">카테고리</label>
                    <select id="favorite-category-select"></select>
                  </div>
                  <div class="fav-form-row">
                    <label for="favorite-link">링크 주소</label>
                    <input type="url" id="favorite-link" placeholder="https://example.com" required />
                  </div>
                  <div class="fav-form-row">
                    <label for="favorite-icon">아이콘</label>
                    <div class="favorite-file-picker">
                      <button type="button" class="btn-secondary favorite-file-trigger" id="favorite-icon-trigger" data-i18n="파일 선택">파일 선택</button>
                      <span class="favorite-file-name" id="favorite-icon-name">선택된 파일 없음</span>
                      <input type="file" id="favorite-icon" class="favorite-file-input" accept="image/*" />
                    </div>
                  </div>
                  <div class="favorite-form-actions">
                    <button type="submit" class="btn-primary">등록</button>
                    <button type="button" class="btn-secondary" id="favorite-cancel-form">취소</button>
                  </div>
                </div>
              </form>

              <section class="user-widget theme-preset-widget is-collapsed hidden" id="theme-preset-widget">
                <div class="user-widget-head">
                  <h4 data-i18n="테마 선택">테마 선택</h4>
                  <button type="button" class="theme-preset-toggle" id="theme-preset-toggle" aria-expanded="false" aria-label="테마 선택 펼치기"></button>
                </div>
                <div class="theme-preset-body">
                  <section class="theme-preset-group">
                    <p class="theme-preset-label" data-i18n="다크">다크</p>
                    <div class="theme-preset-options" id="theme-dark-options"></div>
                  </section>
                  <section class="theme-preset-group">
                    <p class="theme-preset-label" data-i18n="라이트">라이트</p>
                    <div class="theme-preset-options" id="theme-light-options"></div>
                  </section>
                  <p class="theme-preset-help" data-i18n="우측 상단 테마 버튼을 누르면 여기서 선택한 다크/밝은 테마가 적용됩니다.">우측 상단 테마 버튼을 누르면 여기서 선택한 다크/밝은 테마가 적용됩니다.</p>
                </div>
              </section>
            </section>
          </section>

        </div>
      </div>
    </main>
    <footer class="landing-footer" aria-label="Site footer">
      <div class="copyright">© 2026 NK Studio. All rights reserved.</div>
      <div class="footer-links">
        <a href="#" title="Privacy Policy">Privacy Policy</a>
        <span>|</span>
        <a href="#" title="Terms">Terms</a>
        <span>|</span>
        <a href="#" title="Contact">Contact</a>
      </div>
    </footer>
  </div>
</body>

</html>
