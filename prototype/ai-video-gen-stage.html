<!DOCTYPE html>
<html lang="ko" data-theme="dark" class="layout-fixed preload-veiled">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NK_Studio · AI 영상</title>
  <style>
    html.preload-veiled, body.preload-veiled { background: #0f172a; color: #cbd5e1; }
    html.preload-veiled .app, html.preload-veiled .main { visibility: hidden; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=3.1625" />

  <style>
    /* ── Height chain ────────────────────────────────────────── */
    body.layout-fixed.page-videogen .main { height: 100vh; min-height: 0; overflow: hidden; }
    body.layout-fixed.page-videogen .main-body { height: 100%; min-height: 0; overflow: hidden !important; }
    body.layout-fixed.page-videogen .content { height: 100%; min-height: 0; overflow: hidden; }

    /* ── Shell wrapper ───────────────────────────────────────── */
    .vgen-wrap {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Header ──────────────────────────────────────────────── */
    .vgen-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px 0;
      flex-shrink: 0;
      min-width: 0;
    }

    .vgen-title {
      font-size: clamp(22px, 2.1vw, 30px);
      font-weight: 700;
      color: var(--text);
      margin: 0;
      line-height: 1.12;
      letter-spacing: -0.01em;
    }

    .vgen-status-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: flex-start;
    }

    /* ── Workspace grid ──────────────────────────────────────── */
    .vgen-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 460px;
      gap: 10px;
      padding: 10px 16px 12px;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    @media (max-width: 900px) {
      .vgen-layout { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    }

    /* ── Panel cards ─────────────────────────────────────────── */
    .vgen-results-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--card);
    }

    .vgen-gen-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--card);
      min-height: 0;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .vgen-gen-panel::-webkit-scrollbar { display: none; }

    /* ── Panel header ────────────────────────────────────────── */
    .vgen-panel-header {
      padding: 10px 14px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .vgen-panel-title {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .vgen-panel-header-actions { display: flex; gap: 4px; }

    .vgen-clear-all-btn {
      font-size: 0.72rem;
      padding: 3px 10px;
      color: #f87171;
      border: 1px solid color-mix(in srgb, #ef4444 25%, var(--border));
      border-radius: 6px;
    }
    .vgen-clear-all-btn:hover {
      background: color-mix(in srgb, #ef4444 10%, transparent);
      color: #fca5a5;
    }

    /* ── Results list ────────────────────────────────────────── */
    .vgen-loading { animation: vgen-pulse 1.2s ease-in-out infinite; }
    @keyframes vgen-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .vgen-server-card { opacity: 0.85; }
    .vgen-server-card:hover { opacity: 1; }

    .vgen-results-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
      min-height: 0;
    }

    .vgen-empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
      white-space: pre-line;
      line-height: 1.6;
    }

    /* ── Result cards ────────────────────────────────────────── */
    .vgen-result-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, transparent);
      transition: background 0.12s;
    }
    .vgen-result-card:hover { background: color-mix(in srgb, var(--accent) 5%, var(--card)); }
    .vgen-result-card.is-selected {
      background: color-mix(in srgb, var(--accent) 10%, var(--card));
      border-left: 3px solid var(--accent);
    }

    .vgen-result-thumb {
      width: 88px; flex-shrink: 0;
      align-self: stretch;
      border-radius: 6px; overflow: hidden;
      background: var(--bg-2, var(--bg));
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 0.8rem;
      min-height: 52px;
    }
    .vgen-result-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .vgen-result-thumb--done { color: var(--accent); }
    .vgen-result-thumb--done svg { width: 22px; height: 22px; }
    .vgen-result-thumb--error { color: #f87171; font-weight: 700; font-size: 1rem; }

    .vgen-result-info { flex: 1; min-width: 0; }
    .vgen-result-prompt {
      font-size: 0.8rem; color: var(--text); margin: 0 0 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .vgen-result-meta { font-size: 0.72rem; color: var(--muted); margin: 0 0 4px; }
    .vgen-result-error {
      font-size: 0.7rem; color: #f87171; margin: 2px 0 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: help;
    }
    .vgen-result-status { font-size: 0.7rem; font-weight: 600; padding: 1px 7px; border-radius: 99px; }
    .vgen-result-badge {
      display: inline-block; margin-left: 5px;
      font-size: 0.68rem; font-weight: 600; padding: 1px 7px; border-radius: 99px;
      cursor: help;
    }
    .vgen-badge--temp {
      background: color-mix(in srgb, #f59e0b 16%, transparent);
      color: #fbbf24;
      border: 1px solid color-mix(in srgb, #f59e0b 30%, transparent);
    }
    .vgen-status--processing { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
    .vgen-status--done { background: color-mix(in srgb, #22c55e 15%, transparent); color: #4ade80; }
    .vgen-status--error { background: color-mix(in srgb, #ef4444 15%, transparent); color: #f87171; }

    /* ── Action buttons (rounded square) ────────────────────── */
    .vgen-result-actions { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }

    .vgen-action-btn {
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-2, var(--bg));
      color: var(--muted);
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
      text-decoration: none;
      padding: 0;
    }
    .vgen-action-btn:hover { color: var(--text); background: color-mix(in srgb, var(--bg-2, var(--bg)) 80%, var(--accent) 20%); }
    .vgen-action-btn svg { width: 14px; height: 14px; }
    .vgen-action-btn--danger:hover {
      background: color-mix(in srgb, #ef4444 12%, transparent);
      color: #f87171;
      border-color: color-mix(in srgb, #ef4444 30%, var(--border));
    }
    .vgen-action-btn--play { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
    .vgen-action-btn--play:hover { background: color-mix(in srgb, var(--accent) 15%, var(--bg-2, var(--bg))); }
    .vgen-action-btn--retry { color: #fbbf24; border-color: color-mix(in srgb, #f59e0b 35%, var(--border)); }
    .vgen-action-btn--retry:hover { background: color-mix(in srgb, #f59e0b 15%, var(--bg-2, var(--bg))); color: #fcd34d; }
    .vgen-action-btn--retry svg { width: 15px; height: 15px; }

    /* ── Video modal popup ───────────────────────────────────── */
    .vgen-modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .vgen-modal-inner {
      position: relative;
      max-width: 90vw; max-height: 90vh;
      background: #000;
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.65);
    }
    .vgen-modal-close {
      position: absolute; top: 10px; right: 10px;
      width: 32px; height: 32px;
      border-radius: 8px;
      background: rgba(0,0,0,0.65);
      color: #fff; font-size: 1rem; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      z-index: 1; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .vgen-modal-close:hover { background: rgba(20,20,20,0.95); }
    .vgen-modal-video { display: block; max-width: 90vw; max-height: 80vh; min-width: 320px; }
    .vgen-modal-error {
      min-width: 320px; max-width: 90vw;
      margin: 0; padding: 48px 28px;
      color: #f4f4f5; font-size: 0.92rem; line-height: 1.6;
      text-align: center;
    }

    /* ── Gen panel controls ──────────────────────────────────── */
    .vgen-tabs {
      display: flex; gap: 4px;
      background: var(--bg-2, var(--bg));
      padding: 4px; border-radius: 10px;
      border: 1px solid var(--border);
      align-self: flex-start;
    }
    .vgen-tab {
      padding: 6px 18px; border-radius: 7px;
      font-size: 0.82rem; font-weight: 600;
      color: var(--muted); background: transparent; border: none;
      cursor: pointer; transition: background 0.12s, color 0.12s;
      white-space: nowrap;
    }
    .vgen-tab:hover { color: var(--text); }
    .vgen-tab.is-active { background: var(--bg); color: var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
    .vgen-tab.is-disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

    .vgen-row { display: flex; gap: 12px; flex-wrap: nowrap; }
    .vgen-field { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0; }
    .vgen-field--model { flex: 2 1 0; }
    .vgen-field--full { flex: 1 1 100%; }
    .vgen-label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }

    .vgen-select {
      background: var(--bg-2, var(--bg));
      border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 7px 10px;
      font-size: 0.82rem; cursor: pointer; appearance: auto; min-width: 0;
    }
    .vgen-select:focus { outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 1px; }
    .vgen-select option { color: #111; background: #fff; }

    .vgen-image-section { display: flex; gap: 12px; }
    .vgen-image-slot { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .vgen-image-preview {
      border: 2px dashed var(--border); border-radius: 10px; min-height: 140px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; padding: 12px; overflow: hidden;
      background: color-mix(in srgb, var(--bg-2, var(--bg)) 60%, transparent);
      transition: border-color 0.15s;
    }
    .vgen-image-slot--required .vgen-image-preview { border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
    .vgen-image-thumb { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; cursor: zoom-in; }
    .vgen-img-modal-img { display: block; max-width: 88vw; max-height: 84vh; object-fit: contain; border-radius: 10px; }
    .vgen-remove-img { font-size: 0.72rem; color: var(--muted); padding: 2px 8px; }
    .vgen-upload-trigger { font-size: 0.78rem; padding: 6px 14px; }
    .vgen-file-input { display: none; }

    .vgen-prompt-wrap { display: flex; flex-direction: column; }
    .vgen-prompt {
      background: var(--bg-2, var(--bg));
      border: 1px solid var(--border); color: var(--text);
      border-radius: 10px; padding: 12px 14px;
      font-size: 0.85rem; resize: vertical; font-family: inherit;
      line-height: 1.5; min-height: 100px; transition: border-color 0.15s;
    }
    .vgen-prompt:focus { outline: none; border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
    .vgen-prompt::placeholder { color: var(--muted); }

    .vgen-gen-btn {
      width: 100%; padding: 13px; font-size: 0.9rem; font-weight: 700;
      border-radius: 10px; letter-spacing: 0.02em; margin-top: 4px;
    }
    .vgen-gen-btn.is-loading { opacity: 0.65; cursor: not-allowed; }

    /* Model description */
    .vgen-model-desc {
      padding: 8px 10px;
      background: color-mix(in srgb, var(--accent) 6%, var(--bg-2, var(--bg)));
      border-radius: 8px;
      border: 1px solid color-mix(in srgb, var(--accent) 15%, var(--border));
    }
    .vgen-feature-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 5px; }
    .vgen-feature-tag {
      font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 99px;
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .vgen-model-desc-text { font-size: 0.75rem; color: var(--muted); margin: 0; line-height: 1.5; }

    /* Reference images */
    .vgen-refs-section { display: flex; flex-direction: column; gap: 6px; }
    .vgen-refs-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
    .vgen-ref-slot {
      aspect-ratio: 1; border-radius: 8px; border: 1.5px dashed var(--border);
      background: color-mix(in srgb, var(--bg-2, var(--bg)) 60%, transparent);
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
      transition: border-color 0.15s;
    }
    .vgen-ref-slot.has-image { border-style: solid; border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
    .vgen-ref-add {
      width: 100%; height: 100%; background: none; border: none;
      color: var(--muted); font-size: 1.4rem; cursor: pointer;
      transition: color 0.15s;
    }
    .vgen-ref-add:hover { color: var(--accent); }
    .vgen-ref-thumb { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
    .vgen-ref-remove {
      position: absolute; top: 2px; right: 2px;
      width: 18px; height: 18px; border-radius: 50%;
      background: rgba(0,0,0,0.7); color: #fff;
      border: none; cursor: pointer; font-size: 12px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .vgen-ref-file { display: none; }

    /* Audio slot merged into ref grid (Vidu Q3) */
    .vgen-ref-slot--audio { flex-direction: column; gap: 3px; }
    .vgen-ref-slot--audio.has-file {
      border-style: solid;
      border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
      padding: 4px;
    }
    .vgen-ref-add--audio {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; width: 100%; height: 100%; background: none; border: none;
      color: var(--muted); cursor: pointer; transition: color 0.15s;
    }
    .vgen-ref-add--audio:hover { color: var(--accent); }
    .vgen-audio-grid-icon { font-size: 1.3rem; line-height: 1; }
    .vgen-audio-grid-label { font-size: 0.6rem; }
    .vgen-audio-name-mini {
      font-size: 0.58rem; color: var(--text);
      width: 100%; text-align: center;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      padding: 0 4px; line-height: 1.3;
    }

    /* Audio + Video 한 행 (seedance-r2v 등) */
    .vgen-av-row { display: flex; gap: 6px; }

    /* Standalone audio/video slot (ref 그리드 외부) */
    .vgen-audio-solo-section, .vgen-video-solo-section { display: flex; }
    .vgen-audio-solo-section > .vgen-ref-slot--audio,
    .vgen-video-solo-section > .vgen-ref-slot--video {
      flex: 0 0 calc((100% - 24px) / 5);
    }
    .vgen-ref-slot--video { flex-direction: column; gap: 3px; }
    .vgen-ref-slot--video.has-file {
      border-style: solid;
      border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
      padding: 4px;
    }
    .vgen-ref-add--video {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; width: 100%; height: 100%; background: none; border: none;
      color: var(--muted); cursor: pointer; transition: color 0.15s;
    }
    .vgen-ref-add--video:hover { color: var(--accent); }
    .vgen-video-grid-icon { font-size: 1.3rem; line-height: 1; }
    .vgen-video-grid-label { font-size: 0.6rem; }

    /* Audio section */
    .vgen-audio-section { display: flex; flex-direction: column; gap: 6px; }
    .vgen-audio-slot {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-radius: 8px;
      border: 1.5px dashed var(--border);
      background: color-mix(in srgb, var(--bg-2, var(--bg)) 60%, transparent);
      min-height: 40px;
    }
    .vgen-audio-slot.has-file {
      border-style: solid;
      border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
    }
    .vgen-audio-name { font-size: 0.78rem; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vgen-audio-remove, .vgen-video-remove {
      font-size: 0.72rem; color: var(--muted); padding: 2px 8px;
      background: none; border: none; cursor: pointer;
    }

    /* Video section */
    .vgen-video-section { display: flex; flex-direction: column; gap: 6px; }
    .vgen-video-slot {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-radius: 8px;
      border: 1.5px dashed var(--border);
      background: color-mix(in srgb, var(--bg-2, var(--bg)) 60%, transparent);
      min-height: 40px;
    }
    .vgen-video-slot.has-file {
      border-style: solid;
      border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
    }
    .vgen-video-name { font-size: 0.78rem; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .vgen-cam-section { display: flex; flex-direction: column; gap: 6px; }
    .vgen-cam-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }
    .vgen-cam-btn {
      min-height: 32px;
      padding: 5px 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      cursor: pointer;
      font-size: 11px;
      font-family: inherit;
      transition: background 0.12s, border-color 0.12s;
    }
    .vgen-cam-btn:hover { background: rgba(255,255,255,0.07); }
    .vgen-cam-btn.is-active {
      border-color: rgba(255,183,77,0.5);
      background: linear-gradient(135deg, rgba(255,183,77,0.18), rgba(255,122,0,0.12));
      box-shadow: inset 0 0 0 1px rgba(255,183,77,0.16);
      color: #ffb74d;
    }

    .vgen-spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: vgen-spin 0.7s linear infinite;
    }
    @keyframes vgen-spin { to { transform: rotate(360deg); } }
  </style>

  <script src="core.js?v=3.1625" defer></script>
  <script src="js/config.js?v=3.1625" defer></script>
  <script src="js/utils.js?v=3.1625" defer></script>
  <script src="store.js?v=3.1625" defer></script>

  <script src="script.js?v=3.1625" defer></script>
</head>

<body class="layout-fixed page-videogen">
  <div class="grain"></div>
  <div class="app no-sidebar">
    <div id="auth-overlay" class="auth-overlay hidden">
      <div class="auth-card">
        <p class="auth-title">로그인 하세요.</p>
        <a class="btn-primary no-underline" href="app.html">로그인 하기</a>
      </div>
    </div>

    <main class="main">
      <div class="main-body">
        <section class="content vgen-mount"></section>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var container = document.querySelector('.vgen-mount');
