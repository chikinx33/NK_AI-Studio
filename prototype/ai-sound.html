  <style>
    /* ── Height chain ────────────────────────────────────────── */
    body.layout-fixed.page-sound .main { height: 100vh; min-height: 0; overflow: hidden; }
    body.layout-fixed.page-sound .main-body { height: 100%; min-height: 0; overflow: hidden !important; }
    body.layout-fixed.page-sound .content { height: 100%; min-height: 0; overflow: hidden; }

    /* ── Shell wrapper ───────────────────────────────────────── */
    .snd-wrap { display: flex; flex-direction: column; width: 100%; height: 100%; min-height: 0; overflow: hidden; }

    /* ── Header ──────────────────────────────────────────────── */
    .snd-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 10px 16px 0; flex-shrink: 0; min-width: 0; }
    .snd-title { font-size: clamp(22px, 2.1vw, 30px); font-weight: 700; color: var(--text); margin: 0; line-height: 1.12; letter-spacing: -0.01em; }
    .snd-status-pills { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: flex-start; }

    /* ── Dashboard view ──────────────────────────────────────── */
    .snd-dash-scroll { width: 100%; height: 100%; min-height: 0; overflow-y: auto; padding: 20px 24px 28px; }
    .snd-dash-scroll .draft-card { cursor: pointer; }

    /* ── Tabs row ────────────────────────────────────────────── */
    .snd-tabbar { padding: 8px 16px 0; flex-shrink: 0; }
    .snd-tabs { display: inline-flex; gap: 4px; background: var(--bg-2, var(--bg)); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
    .snd-tab { position: relative; padding: 6px 18px; border-radius: 7px; font-size: 0.82rem; font-weight: 600; color: var(--muted); background: transparent; border: none; cursor: pointer; transition: background 0.12s, color 0.12s; white-space: nowrap; }
    .snd-tab:hover { color: var(--text); }
    .snd-tab.is-active { background: var(--bg); color: var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
    .snd-tab.is-disabled { opacity: 0.5; cursor: not-allowed; }
    .snd-tab-badge { font-size: 9px; font-weight: 700; margin-left: 6px; padding: 1px 6px; border-radius: 99px; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); vertical-align: middle; }

    /* ── Workspace grid ──────────────────────────────────────── */
    .snd-layout { display: grid; grid-template-columns: minmax(0, 1fr) 460px; gap: 10px; padding: 10px 16px 12px; flex: 1 1 auto; min-height: 0; overflow: hidden; }
    @media (max-width: 900px) { .snd-layout { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } }

    /* ── Panels ──────────────────────────────────────────────── */
    .snd-left { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: hidden; }
    .snd-panel { display: flex; flex-direction: column; overflow: hidden; min-height: 0; border-radius: 14px; border: 1px solid var(--border); background: var(--card); }
    .snd-gen-panel { display: flex; flex-direction: column; gap: 16px; overflow-y: auto; padding: 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--card); min-height: 0; scrollbar-width: none; -ms-overflow-style: none; }
    .snd-gen-panel::-webkit-scrollbar { display: none; }

    .snd-panel-header { padding: 10px 14px; flex-shrink: 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .snd-panel-title { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .snd-panel-body { flex: 1; overflow-y: auto; min-height: 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; }

    .snd-add-btn { font-size: 0.74rem; padding: 4px 11px; border-radius: 7px; border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border)); color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); cursor: pointer; }
    .snd-add-btn:hover { background: color-mix(in srgb, var(--accent) 16%, transparent); }

    .snd-clear-btn { font-size: 0.72rem; padding: 3px 10px; color: #f87171; border: 1px solid color-mix(in srgb, #ef4444 25%, var(--border)); border-radius: 6px; background: none; cursor: pointer; }
    .snd-clear-btn:hover { background: color-mix(in srgb, #ef4444 10%, transparent); color: #fca5a5; }

    /* ── Segments ────────────────────────────────────────────── */
    .snd-segment { border: 1px solid var(--border); border-radius: 12px; background: color-mix(in srgb, var(--bg-2, var(--bg)) 50%, transparent); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .snd-seg-head { display: flex; align-items: center; gap: 8px; }
    .snd-seg-handle { color: var(--muted); cursor: grab; font-size: 14px; line-height: 1; padding: 2px 4px; user-select: none; }
    .snd-speaker-btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-2, var(--bg)); color: var(--text); font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    .snd-speaker-btn:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
    .snd-speaker-avatar { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.66rem; font-weight: 700; background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); flex-shrink: 0; }
    .snd-seg-spacer { flex: 1; }
    .snd-seg-del { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 6px; line-height: 0; }
    .snd-seg-del:hover { color: #f87171; background: color-mix(in srgb, #ef4444 10%, transparent); }
    .snd-seg-del svg { width: 15px; height: 15px; }
    .snd-seg-text { background: var(--bg-2, var(--bg)); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 9px 11px; font-size: 0.85rem; resize: vertical; font-family: inherit; line-height: 1.5; min-height: 56px; }
    .snd-seg-text:focus { outline: none; border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
    .snd-seg-text::placeholder { color: var(--muted); }

    /* ── Emotion tag chips ───────────────────────────────────── */
    .snd-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .snd-chip { font-size: 0.7rem; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: var(--muted); cursor: pointer; transition: background 0.12s, color 0.12s; }
    .snd-chip:hover { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); background: color-mix(in srgb, var(--accent) 8%, transparent); }

    /* ── Settings fields ─────────────────────────────────────── */
    .snd-field { display: flex; flex-direction: column; gap: 5px; }
    .snd-label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
    .snd-select { background: var(--bg-2, var(--bg)); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 0.82rem; cursor: pointer; appearance: auto; min-width: 0; }
    .snd-select:focus { outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 1px; }
    .snd-select option { color: #111; background: #fff; }
    .snd-voice-pick { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-2, var(--bg)); cursor: pointer; width: 100%; text-align: left; color: var(--text); }
    .snd-voice-pick:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
    .snd-voice-pick-name { font-size: 0.86rem; font-weight: 600; }
    .snd-voice-pick-sub { font-size: 0.72rem; color: var(--muted); }
    .snd-voice-pick-arrow { margin-left: auto; color: var(--muted); }

    /* ── 속도 · 미리듣기 ─────────────────────────────────────── */
    .snd-preview-row { display: flex; gap: 6px; }
    .snd-speed-btn { min-width: 52px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-2, var(--bg)); color: var(--text); font-size: 0.78rem; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums; }
    .snd-speed-btn:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
    .snd-preview-btn { flex: 1; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--accent) 32%, var(--border)); background: none; color: var(--accent); font-size: 0.78rem; font-weight: 600; cursor: pointer; }
    .snd-preview-btn:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .snd-preview-btn:disabled { opacity: 0.7; cursor: progress; }
    .snd-preview-btn .snd-spinner { width: 13px; height: 13px; border-width: 2px; }
    .snd-preview-line { font-size: 0.72rem; color: var(--muted); line-height: 1.45; }

    .snd-prompt { background: var(--bg-2, var(--bg)); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 12px 14px; font-size: 0.85rem; resize: vertical; font-family: inherit; line-height: 1.5; min-height: 96px; }
    .snd-prompt:focus { outline: none; border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
    .snd-prompt::placeholder { color: var(--muted); }

    /* ── Slider ──────────────────────────────────────────────── */
    .snd-slider-row { display: flex; align-items: center; gap: 10px; }
    .snd-slider-row input[type=range] { flex: 1; accent-color: var(--accent); }
    .snd-slider-ends { font-size: 0.68rem; color: var(--muted); white-space: nowrap; }

    .snd-meter { display: flex; justify-content: space-between; align-items: center; font-size: 0.74rem; color: var(--muted); border-top: 1px solid var(--border); padding-top: 12px; }
    .snd-meter strong { color: var(--text); font-weight: 600; }

    .snd-gen-btn { width: 100%; padding: 13px; font-size: 0.9rem; font-weight: 700; border-radius: 10px; letter-spacing: 0.02em; margin-top: 2px; }
    .snd-gen-btn.is-loading { opacity: 0.65; cursor: not-allowed; }

    .snd-scene-btn { width: 100%; padding: 9px; font-size: 0.8rem; font-weight: 600; border-radius: 9px; }

    /* ── Inline row ──────────────────────────────────────────── */
    .snd-row { display: flex; gap: 12px; }
    .snd-row > .snd-field { flex: 1; min-width: 0; }

    /* ── Toggle (looping) ────────────────────────────────────── */
    .snd-toggle-btn { min-width: 64px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-2, var(--bg)); color: var(--muted); font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    .snd-toggle-btn.is-on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); background: color-mix(in srgb, var(--accent) 12%, transparent); }

    /* ── Category chips (SFX) ────────────────────────────────── */
    .snd-cat-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .snd-cat-chip { font-size: 0.72rem; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: var(--muted); cursor: pointer; }
    .snd-cat-chip:hover, .snd-cat-chip.is-active { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); background: color-mix(in srgb, var(--accent) 10%, transparent); }

    /* ── Asset / history list ────────────────────────────────── */
    .snd-empty { padding: 36px 20px; text-align: center; color: var(--muted); font-size: 0.82rem; white-space: pre-line; line-height: 1.6; }
    .snd-asset { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; background: color-mix(in srgb, var(--bg-2, var(--bg)) 40%, transparent); display: flex; flex-direction: column; gap: 8px; }
    .snd-asset.is-processing { opacity: 0.8; }
    .snd-asset-top { display: flex; align-items: center; gap: 8px; }
    .snd-asset-type { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 99px; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
    .snd-asset-type--sfx { background: color-mix(in srgb, #22c55e 16%, transparent); color: #4ade80; }
    .snd-asset-title { font-size: 0.82rem; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .snd-asset-meta { font-size: 0.7rem; color: var(--muted); }
    .snd-asset audio { width: 100%; height: 34px; }
    .snd-asset-actions { display: flex; gap: 6px; }
    .snd-mini-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem; padding: 4px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg-2, var(--bg)); color: var(--muted); cursor: pointer; text-decoration: none; }
    .snd-mini-btn:hover { color: var(--text); border-color: color-mix(in srgb, var(--accent) 30%, var(--border)); }
    .snd-mini-btn--danger:hover { color: #f87171; border-color: color-mix(in srgb, #ef4444 30%, var(--border)); }

    .snd-spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: snd-spin 0.7s linear infinite; }
    @keyframes snd-spin { to { transform: rotate(360deg); } }

    /* ── Voice library modal ─────────────────────────────────── */
    .snd-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.72); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .snd-modal { width: min(880px, 94vw); max-height: 86vh; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: 0 24px 64px rgba(0,0,0,0.5); }
    .snd-modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
    .snd-modal-title { font-size: 0.95rem; font-weight: 700; color: var(--text); }
    .snd-modal-count { font-size: 0.74rem; color: var(--muted); }
    .snd-modal-close { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-2, var(--bg)); color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .snd-modal-close:hover { color: var(--text); }
    .snd-modal-filters { display: flex; flex-direction: column; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--border); }
    .snd-modal-search { width: 100%; background: var(--bg-2, var(--bg)); border: 1px solid var(--border); color: var(--text); border-radius: 9px; padding: 9px 12px; font-size: 0.84rem; }
    .snd-modal-search:focus { outline: none; border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
    .snd-seg-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .snd-seg-tab { padding: 5px 14px; border-radius: 8px; font-size: 0.78rem; font-weight: 600; color: var(--muted); background: var(--bg-2, var(--bg)); border: 1px solid var(--border); cursor: pointer; }
    .snd-seg-tab.is-active { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .snd-modal-body { flex: 1; overflow-y: auto; padding: 16px 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .snd-voice-card { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: color-mix(in srgb, var(--bg-2, var(--bg)) 50%, transparent); display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: border-color 0.12s, background 0.12s; }
    .snd-voice-card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); background: color-mix(in srgb, var(--accent) 6%, var(--card)); }
    .snd-voice-card.is-selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }
    .snd-vc-head { display: flex; align-items: center; gap: 9px; }
    .snd-vc-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.82rem; font-weight: 700; background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); flex-shrink: 0; }
    .snd-vc-name { font-size: 0.88rem; font-weight: 700; color: var(--text); }
    .snd-vc-sub { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .snd-vc-fav { margin-left: auto; background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1rem; line-height: 1; padding: 2px; }
    .snd-vc-fav.is-fav { color: #fbbf24; }
    .snd-vc-desc { font-size: 0.76rem; color: var(--text); line-height: 1.4; }
    .snd-vc-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .snd-vc-tag { font-size: 0.66rem; padding: 1px 7px; border-radius: 99px; background: rgba(255,255,255,0.05); color: var(--muted); }
    .snd-vc-foot { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .snd-vc-preview { display: inline-flex; align-items: center; gap: 5px; font-size: 0.72rem; padding: 4px 10px; border-radius: 7px; border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border)); color: var(--accent); background: none; cursor: pointer; }
    .snd-vc-preview:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .snd-vc-r2v { font-size: 0.62rem; padding: 1px 7px; border-radius: 99px; background: rgba(255,255,255,0.05); color: var(--muted); margin-left: auto; }
    .snd-modal-empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 36px 12px; font-size: 0.84rem; }
  </style>
