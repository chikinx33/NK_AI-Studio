<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NK AI Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#000; --ink:#fff; --muted:#8a8a92;
  --accent:#ff5a1f;
  --c1:#ff7a00; --c2:#5c7cff; --c3:#0bbfa5; --c4:#b47cff; --c5:#ff4d8d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); overflow:hidden;
  font-family:'Space Grotesk',-apple-system,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; min-height:100dvh;
}

/* ===== 헤더 ===== */
header{display:flex;align-items:center;justify-content:space-between;
  padding:clamp(14px,2.2vh,24px) clamp(18px,3vw,38px);flex:0 0 auto}
.logo{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;letter-spacing:-.01em}
.logo i{width:20px;height:20px;border-radius:6px;display:block;
  background:conic-gradient(from 200deg,var(--c1),var(--c5),var(--c4),var(--c2),var(--c3),var(--c1))}
.hlink{font-size:13px;color:var(--muted);text-decoration:none;transition:color .2s}
.hlink:hover{color:#fff}

/* ===== 본문 ===== */
main{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:0 24px;min-height:0}

/* 헤드라인 */
h1{font-weight:700;letter-spacing:-.035em;line-height:1.06}
.rot{display:block;height:clamp(46px,7.4vh,84px);overflow:hidden;position:relative}
.rot b{position:absolute;left:0;right:0;top:0;
  font-family:'Gowun Batang',serif;font-weight:700;font-style:italic;
  font-size:clamp(40px,6.6vh,76px);color:var(--accent);letter-spacing:-.01em;
  transform:translateY(110%);opacity:0;transition:transform .62s cubic-bezier(.16,1,.3,1),opacity .45s}
.rot b.in{transform:translateY(0);opacity:1}
.rot b.out{transform:translateY(-110%);opacity:0}
.fix{display:block;font-size:clamp(28px,4.6vh,52px);margin-top:clamp(2px,.6vh,8px)}

.sub{color:var(--muted);font-size:clamp(13.5px,1.75vh,16px);line-height:1.7;
  margin-top:clamp(14px,2.4vh,26px);max-width:520px}

/* CTA */
.cta{display:inline-flex;align-items:center;gap:9px;margin-top:clamp(18px,3vh,32px);
  background:var(--accent);color:#fff;text-decoration:none;font-weight:600;
  font-size:clamp(14px,1.8vh,16px);padding:clamp(12px,1.7vh,16px) clamp(26px,3.2vw,38px);
  border-radius:999px;transition:.22s;box-shadow:0 10px 34px -8px rgba(255,90,31,.7)}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 42px -8px rgba(255,90,31,.85)}
.cta svg{width:15px;height:15px}

/* 카테고리 라인 */
.facts{display:flex;align-items:center;gap:clamp(10px,1.6vw,20px);
  margin-top:clamp(16px,2.6vh,28px);font-size:clamp(11.5px,1.45vh,13px);
  color:#b9b9c2;flex-wrap:wrap;justify-content:center;letter-spacing:-.005em}
.facts i{width:3px;height:3px;border-radius:50%;background:#3a3a42;display:block}

/* ===== 마퀴 ===== */
.strip{flex:0 0 auto;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.track{display:flex;gap:14px;width:max-content;animation:slide 42s linear infinite;padding:clamp(12px,2vh,22px) 0}
.strip:hover .track{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.card{width:clamp(108px,13vh,148px);aspect-ratio:9/16;border-radius:14px;flex:0 0 auto;
  overflow:hidden;background-size:cover;background-position:center}

/* ===== 푸터 ===== */
footer{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:16px;
  padding:clamp(10px,1.6vh,18px);font-size:11px;color:#55555e;flex-wrap:wrap}
footer a{color:inherit;text-decoration:none}
footer a:hover{color:#9a9aa4}

.tag{position:fixed;left:14px;bottom:12px;font-size:10.5px;color:#4a4a52;letter-spacing:.02em}

@media(max-width:640px){
  .facts{gap:8px}
  .card{width:96px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
  .rot b{transform:none;opacity:1}.rot b:not(.in){display:none}}
</style>
</head>
<body>

<header>
  <div class="logo"><i></i>NK AI Studio</div>
  <a class="hlink" href="#">로그인</a>
</header>

<main>
  <h1>
    <span class="rot" id="rot" aria-live="polite"></span>
    <span class="fix">브랜드 하나면 됩니다</span>
  </h1>

  <p class="sub">캐릭터와 톤을 한 번 정해두면 제작부터 채널 배포, 성과 확인까지 한 자리에서 돌아갑니다.</p>

  <a class="cta" href="app.html">시작하기
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>

  <div class="facts">
    <span>브랜드 IP 관리</span><i></i>
    <span>AI 시네마</span><i></i>
    <span>AI 에이전트 협업</span><i></i>
    <span>SNS 마케팅 자동화</span>
  </div>
</main>

<div class="strip">
  <div class="track" id="track"></div>
</div>

<footer>
  <span>© 2026 NK Studio</span>
  <a href="terms">이용약관</a>
  <a href="privacy">개인정보처리방침</a>
  <a href="mailto:chikinx1@gmail.com">문의</a>
</footer>

<div class="tag">프로토타입 · 스크롤 없는 1화면</div>

<script>
/* 로테이팅 워드 */
(function(){
  const W=['숏폼','캐릭터','에피소드','팬덤','굿즈','채널'],r=document.getElementById('rot');
  let i=0,prev=null;
  function show(t){
    const el=document.createElement('b');el.textContent=t;r.appendChild(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('in')));
    if(prev){const p=prev;p.classList.remove('in');p.classList.add('out');setTimeout(()=>p.remove(),700)}
    prev=el;
  }
  show(W[0]);
  setInterval(()=>{i=(i+1)%W.length;show(W[i])},2400);
})();

/* 마퀴 — 실제 SHAPES 이미지가 들어갈 자리. 지금은 그라데이션 플레이스홀더 */
(function(){
  const bg=[
    'linear-gradient(160deg,#ff7a00,#ff2d6f)',
    'linear-gradient(160deg,#5c7cff,#b47cff)',
    'linear-gradient(160deg,#0bbfa5,#5c7cff)',
    'linear-gradient(160deg,#b47cff,#ff4d8d)',
    'linear-gradient(160deg,#ff9d3d,#ff5a1f)',
    'linear-gradient(160deg,#1a1a24,#3d3d52)',
    'linear-gradient(160deg,#0bbfa5,#0a6e63)',
    'linear-gradient(160deg,#5c7cff,#1a1a24)'
  ];
  const html=bg.map(g=>`<div class="card" style="background:${g}"></div>`).join('');
  document.getElementById('track').innerHTML=html+html;
})();
</script>
</body>
</html>
